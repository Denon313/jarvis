<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جارویس</title>
<style>
  :root{--bg:#faf9f5;--text:#1f1e1d;--mute:#73726c;--line:#e6e3d8;--bubble:#f0eee6;--accent:#d97757;--card:#ffffff;--ok:#5f8f5f;--bad:#c0504d}
  @media (prefers-color-scheme:dark){:root{--bg:#262624;--text:#eceae4;--mute:#a3a198;--line:#3d3c39;--bubble:#34332f;--card:#30302e;--ok:#8fc08f;--bad:#e08a86}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:Vazirmatn,system-ui,-apple-system,Tahoma,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
  header{padding:calc(16px + env(safe-area-inset-top)) 16px 10px;text-align:center}
  header h1{margin:0;font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:500;letter-spacing:.2px}
  #state{margin-top:4px;font-size:13px;color:var(--mute);min-height:18px}
  #log{flex:1;overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth;width:100%;max-width:760px;margin:0 auto}
  .m{line-height:1.95;font-size:16px;white-space:pre-wrap;animation:in .25s ease}
  .me{align-self:flex-start;max-width:85%;background:var(--bubble);padding:10px 16px;border-radius:20px}
  .ai{align-self:stretch;padding:0 2px}
  .step{align-self:stretch;display:flex;align-items:center;gap:9px;color:var(--mute);font-size:14px;animation:in .25s ease}
  .step .ic{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .step .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
  .step.run .t{background:linear-gradient(90deg,var(--mute) 30%,var(--text) 50%,var(--mute) 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.8s linear infinite}
  .step.ok .ic{color:var(--ok)} .step.fail .ic{color:var(--bad)}
  @keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #bar{width:100%;max-width:760px;margin:0 auto;padding:8px 14px calc(14px + env(safe-area-inset-bottom))}
  #box{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:7px 8px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  #box:focus-within{border-color:var(--accent)}
  #txt{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:16px;font-family:inherit;outline:none;padding:8px 10px}
  #txt::placeholder{color:var(--mute)}
  button{border:0;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center}
  #send{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff}
  #send svg{width:18px;height:18px}
  #orb{width:38px;height:38px;border-radius:50%;background:transparent;color:var(--mute);position:relative;transition:background .2s,color .2s}
  #orb svg{width:22px;height:22px}
  #orb .b{transform-box:fill-box;transform-origin:center}
  #orb.wake{color:var(--accent)}
  #orb.wake::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:.5;animation:ring 1.8s ease-out infinite}
  #orb.listen{background:var(--accent);color:#fff}
  #orb.listen .b{animation:bar .9s ease-in-out infinite}
  #orb.listen .b:nth-child(2){animation-delay:.15s} #orb.listen .b:nth-child(3){animation-delay:.3s} #orb.listen .b:nth-child(4){animation-delay:.45s}
  #orb.think{color:var(--accent);animation:pulse 1.2s ease-in-out infinite}
  @keyframes ring{from{transform:scale(.9);opacity:.6}to{transform:scale(1.4);opacity:0}}
  @keyframes bar{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1.25)}}
  #keybtn{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;width:36px;height:36px;border-radius:50%;background:transparent;color:var(--mute)}
  #keybtn:hover{background:var(--bubble)}
  #keybtn svg{width:18px;height:18px}
  header{position:relative}
  #keypanel{display:none;width:100%;max-width:760px;margin:0 auto;padding:0 16px 8px}
  #keypanel.show{display:block}
  #keypanel .row{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px}
  #keyin{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:15px;font-family:inherit;outline:none;padding:6px 8px;direction:ltr;text-align:left}
  #keysave{background:var(--accent);color:#fff;border-radius:12px;padding:8px 16px;font-size:14px}
  .ver{font-family:system-ui,-apple-system,sans-serif;font-size:12px;font-weight:500;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 10px;vertical-align:middle;margin-inline-start:8px;background:var(--card)}
  .m.md{white-space:normal}
  .md p{margin:0 0 10px}
  .md h4{margin:14px 0 6px;font-size:16.5px}
  .md ul,.md ol{margin:0 0 10px;padding-inline-start:24px}
  .md li{margin-bottom:4px}
  .md a{color:var(--accent)}
  .md :not(pre)>code{background:var(--bubble);padding:1px 6px;border-radius:6px;font-size:.9em;direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,Consolas,monospace}
  .code{margin:12px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
  .ch{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);direction:ltr}
  .cb{display:flex;gap:2px;direction:rtl}
  .cb button{background:transparent;color:var(--accent);font-size:13px;padding:4px 10px;border-radius:8px}
  .cb button:hover{background:var(--bubble)}
  .code pre{margin:0;padding:12px 14px;overflow-x:auto;direction:ltr;text-align:left;font-size:13px;line-height:1.65;font-family:ui-monospace,Menlo,Consolas,monospace}
  .pv{display:block;width:100%;height:340px;border:0;border-top:1px solid var(--line);background:#fff}
  .ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
  .ov .ob{display:flex;justify-content:flex-end;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
  .ov .ob button{background:var(--accent);color:#fff;border-radius:10px;padding:8px 16px;font-size:14px}
  .ov iframe{flex:1;border:0;background:#fff;width:100%}
</style>
</head>
<body>
<header><h1>جارویس<span class="ver">Jarvis 1.0</span></h1><div id="state">دکمه‌ی صدا رو بزن تا گوش بدم</div>
  <button id="keybtn" title="کلید API" aria-label="کلید API"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg></button>
</header>
<div id="keypanel"><div class="row"><input id="keyin" type="password" placeholder="gsk_..." autocomplete="off"><button id="keysave">ذخیره</button></div></div>
<div id="log"></div>
<div id="bar"><div id="box">
  <button id="orb" title="گوش دادن" aria-label="گوش دادن"><svg viewBox="0 0 24 24" fill="currentColor"><rect class="b" x="3" y="9" width="2.6" height="6" rx="1.3"/><rect class="b" x="8" y="5" width="2.6" height="14" rx="1.3"/><rect class="b" x="13" y="7" width="2.6" height="10" rx="1.3"/><rect class="b" x="18" y="10" width="2.6" height="4" rx="1.3"/></svg></button>
  <input id="txt" placeholder="هر چی می‌خوای بپرس…">
  <button id="send" aria-label="ارسال"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:scaleX(-1)"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
</div></div>
<script>
// برای مخفی کردن دکمه‌ی کلید، این رو false کن (منطق API دست نمی‌خوره)
const SHOW_KEY_BUTTON=true;
const GROQ_KEY=''; // اختیاری: کلید داخل کد (پیشنهاد نمیشه)
const MODEL='openai/gpt-oss-120b';
const SEARCH_MODEL='groq/compound-mini';
function getKey(){ let k=''; try{ k=localStorage.getItem('groqkey')||''; }catch(e){} k=k||GROQ_KEY; return k.startsWith('gsk_')?k:''; }

const log=document.getElementById('log');
const txt=document.getElementById('txt');
const orb=document.getElementById('orb');
const sendBtn=document.getElementById('send');
const stateEl=document.getElementById('state');
const ICON_SEND='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:scaleX(-1)"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const ICON_STOP='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>';

function scrollDown(){ log.scrollTop=log.scrollHeight; }
function add(cls,t){ const d=document.createElement('div'); d.className='m '+cls; d.textContent=t; log.appendChild(d); scrollDown(); }
function setState(kind,label){ orb.className=kind||''; stateEl.textContent=label||''; }

/* ---------- لغو (مثل کلود) ---------- */
let ctrl=null, running=false;
function chk(){ if(ctrl&&ctrl.signal.aborted) throw new DOMException('stopped','AbortError'); }
function setRunning(b){ running=b; sendBtn.innerHTML=b?ICON_STOP:ICON_SEND; sendBtn.title=b?'توقف':'ارسال'; }
function stopAll(){
  if(!running) return;
  try{ ctrl.abort(); }catch(e){}
  stopSpeech();
  for(const s of [...active]) s.fail('متوقف شد');
}
async function run(fn){
  if(running) return;
  ctrl=new AbortController(); setRunning(true);
  try{ await fn(); await waitSpeech(); }
  catch(e){ if(e.name!=='AbortError') console.error(e); }
  finally{ setRunning(false); }
}

/* ---------- صدا ---------- */
let speaking=0;
function speak(t){
  const parts=[]; let cur='';
  for(const s of t.split(/(?<=[.!؟?\n])\s*/)){
    if(!s) continue;
    if(cur && (cur+s).length>170){ parts.push(cur); cur=s; } else cur+=(cur?' ':'')+s;
  }
  if(cur) parts.push(cur);
  for(const p of parts){
    try{
      const u=new SpeechSynthesisUtterance(p); u.lang='fa-IR';
      speaking++; let done=false;
      const fin=()=>{ if(!done){done=true; speaking=Math.max(0,speaking-1);} };
      u.onend=fin; u.onerror=fin; setTimeout(fin,25000);
      speechSynthesis.speak(u);
    }catch(e){}
  }
}
function stopSpeech(){ try{ speechSynthesis.cancel(); }catch(e){} speaking=0; }
function say(t){ add('ai',t); speak(t); }
function waitSpeech(){ return new Promise(r=>{ const iv=setInterval(()=>{ if(speaking===0){clearInterval(iv);r();} },150); }); }
function clean(t){
  return t.replace(/【[^】]*】/g,'').replace(/\[\d+\]/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')
    .replace(/[*`#>]+/g,'').replace(/^\s*[-•]\s+/gm,'').replace(/\n{3,}/g,'\n\n').trim();
}

/* ---------- نمایش مارک‌داون و کد (مثل کلود) ---------- */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s"']+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function proseHTML(t){
  const out=[]; let list=null;
  const close=()=>{ if(list){ out.push('</'+list+'>'); list=null; } };
  for(const line of t.split('\n')){
    let m;
    if((m=/^\s*(#{1,4})\s+(.*)/.exec(line))){ close(); out.push('<h4>'+inline(m[2])+'</h4>'); }
    else if((m=/^\s*[-*•]\s+(.*)/.exec(line))){ if(list!=='ul'){ close(); out.push('<ul>'); list='ul'; } out.push('<li>'+inline(m[1])+'</li>'); }
    else if((m=/^\s*\d+[.)]\s+(.*)/.exec(line))){ if(list!=='ol'){ close(); out.push('<ol>'); list='ol'; } out.push('<li>'+inline(m[1])+'</li>'); }
    else if(!line.trim()){ close(); }
    else{ close(); out.push('<p>'+inline(line)+'</p>'); }
  }
  close();
  return out.join('');
}
function copyText(t){
  const fb=()=>{ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); try{document.execCommand('copy');}catch(e){} a.remove(); };
  try{ navigator.clipboard.writeText(t).catch(fb); }catch(e){ fb(); }
}
function runKind(lang,code){
  if(['html','htm'].includes(lang)||(!lang&&/<!doctype|<html/i.test(code))) return 'html';
  if(['js','javascript'].includes(lang)) return 'js';
  return null;
}
function srcdocFor(kind,code){
  if(kind==='html') return code;
  return '<!DOCTYPE html><meta charset="utf-8"><body style="font-family:monospace;padding:10px;background:#fff;color:#111;direction:ltr"><pre id="o" style="white-space:pre-wrap"></pre><script>const o=document.getElementById("o");const p=(...a)=>{o.textContent+=a.map(x=>typeof x==="object"?JSON.stringify(x):String(x)).join(" ")+"\\n"};console.log=p;console.error=(...a)=>p("خطا:",...a);window.onerror=m=>p("خطا:",m);try{\n'+code+'\n}catch(e){p("خطا:",e.message)}<\/script>';
}
function fullscreen(src){
  const ov=document.createElement('div'); ov.className='ov';
  const bar=document.createElement('div'); bar.className='ob';
  const b=document.createElement('button'); b.textContent='بستن'; b.onclick=()=>ov.remove(); bar.appendChild(b);
  const f=document.createElement('iframe'); f.sandbox='allow-scripts allow-forms allow-modals'; f.srcdoc=src;
  ov.append(bar,f); document.body.appendChild(ov);
}
function makeCode(lang,code,canRun){
  const wrap=document.createElement('div'); wrap.className='code';
  const head=document.createElement('div'); head.className='ch';
  const label=document.createElement('span'); label.textContent=lang||'code'; head.appendChild(label);
  const btns=document.createElement('span'); btns.className='cb'; head.appendChild(btns);
  const mk=(t,fn)=>{ const b=document.createElement('button'); b.textContent=t; b.onclick=()=>fn(b); btns.appendChild(b); return b; };
  mk('کپی',b=>{ copyText(code); b.textContent='کپی شد'; setTimeout(()=>{b.textContent='کپی';},1500); });
  const kind=runKind(lang,code);
  let frame=null;
  if(canRun&&kind){
    mk('تمام‌صفحه',()=>fullscreen(srcdocFor(kind,code)));
    mk('اجرا',b=>{
      if(frame){ frame.remove(); frame=null; b.textContent='اجرا'; }
      else{ frame=document.createElement('iframe'); frame.className='pv'; frame.sandbox='allow-scripts allow-forms allow-modals'; frame.srcdoc=srcdocFor(kind,code); wrap.appendChild(frame); b.textContent='بستن'; }
    });
  }
  const pre=document.createElement('pre'); const c=document.createElement('code'); c.textContent=code; pre.appendChild(c);
  wrap.append(head,pre);
  return wrap;
}
function renderMD(el,text,final){
  el.textContent='';
  const re=/```([\w+#-]*)[^\n]*\n([\s\S]*?)(```|$)/g;
  let last=0,m;
  const prose=t=>{ if(!t.trim()) return; const d=document.createElement('div'); d.innerHTML=proseHTML(t); el.appendChild(d); };
  while((m=re.exec(text))){
    prose(text.slice(last,m.index));
    el.appendChild(makeCode((m[1]||'').toLowerCase(),m[2].replace(/\n$/,''),final&&m[3]==='```'));
    last=m.index+m[0].length;
    if(m[0].length===0) re.lastIndex++;
  }
  prose(text.slice(last));
}
function speakable(t){
  const hadCode=/```/.test(t);
  let s=clean(t.replace(/```[\s\S]*?(```|$)/g,' ')).replace(/\s+/g,' ').trim();
  if(s.length>1200) s=s.slice(0,1200)+'…';
  if(hadCode) s+=(s?' ':'')+'کدش رو توی صفحه نوشتم.';
  return s;
}

/* ---------- مرحله‌های وضعیت (مثل کلود/چت‌جی‌پی‌تی) ---------- */
const active=new Set();
function startStep(text){
  const d=document.createElement('div');
  d.className='step run'; d.innerHTML='<span class="ic"><span class="dot"></span></span><span class="t"></span>';
  d.querySelector('.t').textContent=text; log.appendChild(d); scrollDown();
  const CHECK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
  const CROSS='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const api={};
  const fin=(cls,icon,t)=>{ active.delete(api); if(!d.isConnected) return; d.className='step '+cls; d.querySelector('.ic').innerHTML=icon; if(t) d.querySelector('.t').textContent=t; };
  api.set=t=>{ if(d.isConnected) d.querySelector('.t').textContent=t; };
  api.done=t=>fin('ok',CHECK,t);
  api.fail=t=>fin('fail',CROSS,t);
  api.remove=()=>{ active.delete(api); d.remove(); };
  active.add(api);
  return api;
}

/* ---------- نرمال‌سازی و فاصله‌ی ویرایشی ---------- */
function norm(s){
  return s.toLowerCase()
    .replace(/ي/g,'ی').replace(/ك/g,'ک')
    .replace(/[\u064B-\u065F\u200c]/g,' ')
    .replace(/[؟?!.,،]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    prev=cur;
  }
  return prev[n];
}
function sim(a,b){ const L=Math.max(a.length,b.length); return L? 1-lev(a,b)/L : 1; }
function hasTok(tokens, word, th=0.7){ return tokens.some(t=>sim(t,word)>=th); }

/* ---------- دستورهای ساده (کل جمله) ---------- */
const SIMPLE = {
  greet:{label:'سلام', phrases:['سلام','درود','سلام جارویس']},
  dollar:{label:'دلار', phrases:['دلار','قیمت دلار']},
  date:{label:'تاریخ امروز', phrases:['امروز چندمه','امروز چندم','تاریخ امروز','امروز چندم ماهه']},
  time:{label:'ساعت', phrases:['ساعت چنده','ساعت','الان ساعت چنده']}
};
function fastLocal(raw){
  const tk=norm(raw).split(' ').filter(Boolean);
  if(tk.length&&isWakeTok(tk[0])) tk.shift();
  const t=tk.join(' ');
  for(const k in SIMPLE) if(SIMPLE[k].phrases.some(p=>norm(p)===t)) return k;
  return null;
}

/* ---------- اپ‌ها: روی اندروید خود اپ باز میشه، جای دیگه سایتش ---------- */
const APPS = [
  {names:['اینستاگرام','اینستا','instagram'],pkg:'com.instagram.android',web:'https://instagram.com'},
  {names:['تلگرام','تلگرم','telegram'],pkg:'org.telegram.messenger',web:'https://web.telegram.org'},
  {names:['واتساپ','واتس اپ','واتس آپ','whatsapp'],pkg:'com.whatsapp',web:'https://web.whatsapp.com'},
  {names:['یوتیوب','یوتوب','youtube'],pkg:'com.google.android.youtube',web:'https://youtube.com'},
  {names:['گوگل','google'],pkg:'com.google.android.googlequicksearchbox',web:'https://google.com'},
  {names:['نقشه','گوگل مپ','مپ','نقشه گوگل'],pkg:'com.google.android.apps.maps',web:'https://maps.google.com'},
  {names:['کروم','chrome'],pkg:'com.android.chrome',web:'https://google.com'},
  {names:['جیمیل','gmail'],pkg:'com.google.android.gm',web:'https://mail.google.com'},
  {names:['توییتر','ایکس','تویتر','twitter'],pkg:'com.twitter.android',web:'https://x.com'},
  {names:['گیت هاب','گیتهاب','github'],pkg:'com.github.android',web:'https://github.com'},
  {names:['دیوار'],pkg:'ir.divar',web:'https://divar.ir'},
  {names:['دیجی کالا','دیجیکالا'],pkg:'com.digikala',web:'https://digikala.com'},
  {names:['اسنپ','snapp'],pkg:'cab.snapp.passenger',web:'https://app.snapp.taxi'},
  {names:['آپارات','اپارات'],pkg:'',web:'https://aparat.com'}
];
const CITIES = {'تهران':'Tehran','مشهد':'Mashhad','اصفهان':'Isfahan','شیراز':'Shiraz','تبریز':'Tabriz','کرج':'Karaj','اهواز':'Ahvaz','قم':'Qom','رشت':'Rasht'};
const FILLER = ['رو','را','لطفا','جارویس','برام','ی','یه','یک','کن','بزن','باز','زنگ','سرچ','جستجو','به','برای','از','اپ','برنامه'];

function digits(s){ return s.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)); }
function openUrl(url){ const w=window.open(url,'_blank'); if(!w) location.href=url; }

/* ---------- اجرای دستورها ---------- */
const ACTIONS = {
  greet(){ say('سلام! چی کار می‌تونم برات بکنم؟'); },
  dollar(){ return search('قیمت دلار امروز در ایران','قیمت دلار امروز چنده؟'); },
  date(){
    const d=new Date();
    say('امروز '+d.toLocaleDateString('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' است. تاریخ میلادی: '+d.toLocaleDateString('en-GB'));
  },
  time(){ say('ساعت '+new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})+' است.'); }

async function groq(messages,opts={}){
  const model=opts.model||MODEL, compound=model.startsWith('groq/compound');
  const body={model,temperature:opts.temp??0,messages};
  if(!compound){ body.reasoning_effort=opts.effort||'low'; if(opts.json) body.response_format={type:'json_object'}; }
  if(opts.max) body.max_completion_tokens=opts.max;
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',signal:ctrl&&ctrl.signal,
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+getKey()},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(r.status+' ['+model+'] '+(await r.text()).slice(0,200));
  return (await r.json()).choices[0].message.content.trim();
}

async function groqStream(messages,opts,onDelta){
  const body={model:MODEL,temperature:opts.temp??0.6,messages,stream:true,reasoning_effort:opts.effort||'medium'};
  if(opts.max) body.max_completion_tokens=opts.max;
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',signal:ctrl&&ctrl.signal,
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+getKey()},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(r.status+' ['+MODEL+'] '+(await r.text()).slice(0,200));
  const reader=r.body.getReader(), dec=new TextDecoder();
  let buf='', full='';
  while(true){
    const {done,value}=await reader.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
      if(!line.startsWith('data:')) continue;
      const d=line.slice(5).trim(); if(!d||d==='[DONE]') continue;
      try{ const c=JSON.parse(d).choices[0].delta.content; if(c){ full+=c; onDelta(full); } }catch(e){}
    }
  }
  return full;
}

async function weather(city){
  const step=startStep('در حال گرفتن آب‌وهوا'+(city?' '+city:'')+'…');
  speak('یه لحظه، دارم آب‌وهوا رو بررسی می‌کنم');
  try{
    const en=CITIES[city]||city||'';
    const r=await fetch('https://wttr.in/'+encodeURIComponent(en)+'?format=j1&lang=fa',{signal:ctrl&&ctrl.signal});
    const j=await r.json(); const c=j.current_condition[0];
    const desc=(c.lang_fa&&c.lang_fa[0]&&c.lang_fa[0].value)||c.weatherDesc[0].value;
    chk(); step.done('آب‌وهوا دریافت شد');
    say((city?city+': ':'')+'دما '+c.temp_C+' درجه، احساس‌شده '+c.FeelsLikeC+' درجه، '+desc+'، رطوبت '+c.humidity+' درصد.');
  }catch(e){
    if(e.name==='AbortError') throw e;
    step.fail('دریافت آب‌وهوا ناموفق بود'); say('نتونستم آب‌وهوا رو بگیرم. اینترنت رو چک کن.');
  }
}

async function search(q,orig){
  const s1=startStep('در حال جستجو در وب: «'+q+'»…');
  speak('یه لحظه، دارم درباره‌اش جستجو می‌کنم');
  if(getKey()){
    try{
      const a=clean(await groq([
        {role:'system',content:'You are the web research engine of a Persian voice assistant. Search the web and answer accurately and concisely in natural spoken Persian (2 to 5 sentences). Give concrete facts and numbers when they exist and mention when the info was published if it matters. No markdown, no links, no citation marks. If you cannot find reliable information, say so honestly.'},
        {role:'user',content:orig||q}],{model:SEARCH_MODEL,temp:.2,max:1500}));
      chk();
      if(a){ s1.done('جستجوی وب انجام شد'); return say(a); }
    }catch(e){ if(e.name==='AbortError') throw e; }
    s1.set('در حال جستجو در ویکی‌پدیا…');
  }
  let extract='';
  try{
    const u='https://fa.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+
      '&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&exsentences=6&format=json&origin=*';
    const j=await (await fetch(u,{signal:ctrl&&ctrl.signal})).json();
    const p=j.query&&Object.values(j.query.pages)[0];
    if(p&&p.extract) extract=p.extract;
  }catch(e){ if(e.name==='AbortError') throw e; }
  chk();
  if(extract){
    s1.done('جستجو در ویکی‌پدیا انجام شد');
    if(getKey()){
      const s2=startStep('در حال خوندن نتیجه‌ها…');
      try{
        const a=clean(await groq([{role:'system',content:'Answer the user question in short natural spoken Persian (1 to 3 sentences) using ONLY the provided text. If the text does not answer the question, reply exactly: NOT_FOUND'},
          {role:'user',content:JSON.stringify({question:orig||q,text:extract})}],{max:1000}));
        if(a&&a!=='NOT_FOUND'){ s2.done('جواب آماده شد'); return say(a); }
        s2.fail('نتیجه مرتبط نبود');
      }catch(e){ if(e.name==='AbortError') throw e; s2.fail('خوندن نتیجه ناموفق بود'); }
    }else return say(extract);
  }else s1.fail('نتیجه‌ی مستقیمی پیدا نشد');
  say('جواب مستقیم پیدا نکردم، نتیجه‌ی گوگل رو برات باز می‌کنم.');
  openUrl('https://www.google.com/search?q='+encodeURIComponent(q));
}

function findApp(name){
  const n=norm(name).replace(/\s/g,'');
  if(!n) return null;
  let best=null,bs=0;
  for(const a of APPS) for(const k of a.names){ const s=sim(n,norm(k).replace(/\s/g,'')); if(s>bs){bs=s;best=a;} }
  return bs>=0.75?best:null;
}
function openApp(name){
  const app=findApp(name);
  if(!app){
    if(name) return say('اپ «'+name+'» رو بلد نیستم. سرچش کنم؟ بگو «سرچ کن '+name+'»');
    return say('چی رو باز کنم؟');
  }
  say(app.names[0]+' رو باز می‌کنم.');
  if(app.pkg && /Android/i.test(navigator.userAgent)){
    location.href='intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package='+app.pkg+
      ';S.browser_fallback_url='+encodeURIComponent(app.web)+';end';
  }else openUrl(app.web);
}
function callTo(name){
  const num=digits(name).replace(/\D/g,'');
  if(num.length>=3){ location.href='tel:'+num; say('دارم به '+num+' زنگ می‌زنم.'); }
  else say('تو نسخه‌ی وب به مخاطب‌ها دسترسی ندارم. شماره رو بگو. تو نسخه‌ی اندروید با اسم هم زنگ می‌زنم.');
}
function lastMsg(){ say('خوندن پیام‌ها فقط تو نسخه‌ی اندروید ممکنه. تو مرورگر به نوتیفیکیشن‌ها دسترسی ندارم.'); }

/* ---------- مغز آفلاین (وقتی کلید نیست یا Groq وصل نمیشه) ---------- */
let pending=null;

function localHandle(raw){
  let t=norm(raw);
  let tokens=t.split(' ').filter(Boolean);
  if(tokens.length && sim(tokens[0],'جارویس')>=0.7){ tokens.shift(); t=tokens.join(' '); }

  if(pending){
    const opts=pending; pending=null;
    let best=null,bs=0;
    for(const o of opts){ for(const p of SIMPLE[o].phrases){ const s=sim(t,norm(p)); if(s>bs){bs=s;best=o;} } }
    if(bs>=0.6){ return ACTIONS[best](); }
    say('ببخشید، باز هم نفهمیدم. می‌شه دوباره بگی؟');
    return;
  }

  const rest=()=>tokens.filter(w=>!FILLER.some(f=>sim(w,f)>=0.85)).join(' ');
  if(hasTok(tokens,'هوا') || hasTok(tokens,'آبوهوا') || (hasTok(tokens,'آب')&&hasTok(tokens,'هوا')))
    return weather(tokens.filter(w=>!['آب','و','هوا','چطوره','چطور','است','آبوهوا','چطوری','هواشناسی','وضعیت'].includes(w)&&!FILLER.includes(w)).join(' '));
  if(hasTok(tokens,'پیام')) return lastMsg();
  if(hasTok(tokens,'سرچ')||hasTok(tokens,'جستجو')) return search(rest());
  if(hasTok(tokens,'زنگ')&&hasTok(tokens,'بزن')) return callTo(rest());
  if(hasTok(tokens,'باز')&&hasTok(tokens,'کن')) return openApp(rest());

  const scores=Object.keys(SIMPLE).map(k=>({k,s:Math.max(...SIMPLE[k].phrases.map(p=>sim(t,norm(p))))})).sort((a,b)=>b.s-a.s);
  const [a,b]=scores;
  if(a.s>=0.85 && a.s-b.s>=0.15) return ACTIONS[a.k]();
  if(a.s>=0.5){
    if(a.s-b.s<0.15 && b.s>=0.5){
      pending=[a.k,b.k];
      return say('ببخشید، منظورت '+SIMPLE[a.k].label+' بود یا '+SIMPLE[b.k].label+'؟');
    }
    if(a.s>=0.7) return ACTIONS[a.k]();
    pending=[a.k,b.k];
    return say('ببخشید، منظورت '+SIMPLE[a.k].label+' بود یا '+SIMPLE[b.k].label+'؟');
  }
  say('ببخشید، منظورت رو نفهمیدم.');
}

/* ---------- Groq: فهمیدن منظور و چت ---------- */
const LABEL={greet:'سلام',dollar:'دلار',date:'تاریخ امروز',time:'ساعت'};
let askedOptions=null;
const convo=[];

const SYS=`You are the intent parser of a Persian voice assistant. The text comes from speech recognition and may contain misheard words (for example "دلام" could be "سلام" or "دلار").
Reply with JSON only: {"intent":"...","param":"...","options":[]}
intent is one of: greet, dollar, date, time, weather, search, open_app, call, last_message, ambiguous, chat, unknown.
- greet: only a plain greeting (سلام). dollar: asks the dollar price. date: today's date. time: current time.
- weather: param = city name in Persian or "" if none.
- search: anything that needs up-to-date or looked-up information: news, prices, sports results, who currently holds a position, recent events, product details, "latest ...". param = a clear self-contained Persian search query (use the recent conversation to complete follow-up questions).
- open_app: the user wants to open an app or site; param = app name in Persian. call: param = phone number or contact name. last_message: param = sender name (e.g. Bro).
- If the text is close to two different commands and you cannot decide, intent="ambiguous" and options = the two intent codes (from greet, dollar, date, time).
- If "pending_question_options" is given, the user is answering the question "did you mean X or Y?". Pick the matching intent from those options; if the answer is unclear, intent="unknown".
- chat: everything else: small talk, questions about you (who are you, who made you), general knowledge, explanations, advice, math, coding, writing code, jokes, opinions, any normal conversation.
- unknown only if the text is meaningless noise.
"recent" holds the last messages of the conversation for context.`;

function sysChat(){
  const now=new Date();
  const d=now.toLocaleDateString('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const tm=now.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
  return `You are Jarvis 1.0 (جارویس), a warm, sharp and honest Persian assistant, in the spirit of Claude: thoughtful, direct, genuinely helpful.
Identity: if someone asks who made you or who you are, say in Persian that you are Jarvis 1.0, that a person named Mehdi (مهدی) built you, and that you run on a language model from OpenAI. Never claim to be human and never claim to be Claude or ChatGPT.
Now: ${d}, ساعت ${tm}.
Style: reply in natural Persian and answer the question directly first. For casual or simple questions use 1 to 4 plain sentences, because they may be read aloud. When a topic really needs it you may write longer answers with short lists or bold. Never use emoji. Be friendly and casual like a smart friend and match the user's tone.
Code: when the user asks you to write, fix or explain code, put the complete, working code in fenced code blocks with a language tag (html, javascript, python and so on). For web pages, games, tools and visual demos write ONE self-contained HTML file with inline CSS and JS and no external libraries or network requests, so the Run button in the chat can run it. Say in one short sentence what you are building before the code, and after the code explain in 1 to 3 sentences how it works or how to use it. Write comments and explanations in Persian. Never leave code half-finished.
Quality: think carefully before answering. For math, logic, coding and advice questions work it out step by step privately and give a correct, concrete answer. If you are not sure or the information may be outdated, say so honestly instead of guessing. Ask one short clarifying question only when it is really needed.
Abilities: you run as a web page and can open apps and websites, search the web, check the weather, tell the date and time, and write code; the user can run html and javascript code blocks with the Run button. You cannot run Python or other languages, and you cannot read messages or contacts here. Never pretend to have done something you did not do.`;
}

async function chat(text,think){
  convo.push({role:'user',content:text});
  let bubble=null, partial='', raf=false;
  const mkBubble=()=>{ if(!bubble){ if(think) think.remove(); bubble=document.createElement('div'); bubble.className='m ai md'; log.appendChild(bubble); } };
  try{
    const full=await groqStream([{role:'system',content:sysChat()},...convo.slice(-20)],{temp:.6,effort:'medium',max:8000},t=>{
      partial=t; mkBubble();
      if(!raf){ raf=true; requestAnimationFrame(()=>{ raf=false; renderMD(bubble,partial,false); scrollDown(); }); }
    });
    chk();
    const reply=full.trim()||'ببخشید، جوابی نداشتم. دوباره بپرس.';
    mkBubble(); renderMD(bubble,reply,true); scrollDown();
    convo.push({role:'assistant',content:reply});
    speak(speakable(reply));
  }catch(e){
    convo.pop();
    if(e.name==='AbortError' && bubble && partial.trim()){
      renderMD(bubble,partial,true);
      convo.push({role:'user',content:text},{role:'assistant',content:partial});
    }
    throw e;
  }
}

function parseIntent(s){ try{ return JSON.parse(s); }catch(e){ return {intent:'chat'}; } }

async function process(raw){
  add('me',raw);
  if(!getKey()) return localHandle(raw);
  if(!askedOptions){ const k=fastLocal(raw); if(k) return await ACTIONS[k](); }
  const think=startStep('در حال فکر کردن…');
  try{
    const res=parseIntent(await groq([{role:'system',content:SYS},
      {role:'user',content:JSON.stringify({text:raw,pending_question_options:askedOptions,recent:convo.slice(-4)})}],{json:true}));
    chk();
    askedOptions=null;
    const p=(res.param||'').trim();
    if(res.intent!=='chat') think.remove();
    switch(res.intent){
      case 'greet': case 'dollar': case 'date': case 'time': return await ACTIONS[res.intent]();
      case 'weather': return await weather(p);
      case 'search': return await search(p||raw,raw);
      case 'open_app': return openApp(p);
      case 'call': return callTo(p);
      case 'last_message': return lastMsg();
      case 'ambiguous':{
        const o=(res.options||[]).filter(x=>LABEL[x]).slice(0,2);
        if(o.length===2){ askedOptions=o; return say('ببخشید، منظورت '+LABEL[o[0]]+' بود یا '+LABEL[o[1]]+'؟'); }
        return say('ببخشید، منظورت رو نفهمیدم.');
      }
      case 'chat': return await chat(raw,think);
      default: return say('ببخشید، منظورت رو نفهمیدم.');
    }
  }catch(e){
    think.remove();
    if(e.name==='AbortError') throw e;
    say('به Groq وصل نشدم ('+e.message+'). با روش آفلاین جواب می‌دم.');
    localHandle(raw);
  }finally{ think.remove(); }
}

/* ---------- تبدیل صدا به متن با Whisper ---------- */
async function whisper(blob){
  const fd=new FormData();
  fd.append('file',blob,'voice.webm'); fd.append('model','whisper-large-v3'); fd.append('language','fa'); fd.append('temperature','0');
  const r=await fetch('https://api.groq.com/openai/v1/audio/transcriptions',{method:'POST',signal:ctrl&&ctrl.signal,headers:{Authorization:'Bearer '+getKey()},body:fd});
  if(!r.ok) throw new Error('whisper '+r.status);
  const t=(await r.json()).text.trim();
  if(t.length<2||/زیرنویس|تماشا کردید|مشترک شوید|subtitle/i.test(t)) return '';
  return t;
}

function beep(){
  try{ const c=new (window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(); const g=c.createGain();
    o.frequency.value=880; g.gain.value=.15; o.connect(g); g.connect(c.destination); o.start(); setTimeout(()=>{o.stop();c.close();},130);}catch(e){}
}

async function recordCommand(){
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const an=ctx.createAnalyser(); an.fftSize=1024; ctx.createMediaStreamSource(stream).connect(an);
  const buf=new Uint8Array(an.fftSize);
  const mr=new MediaRecorder(stream); const chunks=[];
  mr.ondataavailable=e=>chunks.push(e.data);
  mr.start();
  let spoke=false,last=Date.now(); const start=Date.now();
  return new Promise(res=>{
    const iv=setInterval(()=>{
      an.getByteTimeDomainData(buf); let sum=0;
      for(const v of buf){ const d=(v-128)/128; sum+=d*d; }
      const rms=Math.sqrt(sum/buf.length), now=Date.now();
      if(rms>0.04){ spoke=true; last=now; }
      if((ctrl&&ctrl.signal.aborted)||(spoke&&now-last>1300)||now-start>12000||(!spoke&&now-start>6000)){ clearInterval(iv); mr.stop(); }
    },100);
    mr.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop()); ctx.close();
      if(!spoke||(ctrl&&ctrl.signal.aborted)) return res('');
      setState('think','در حال تشخیص صدا…');
      try{ res(await whisper(new Blob(chunks,{type:mr.mimeType}))); }
      catch(e){ if(e.name!=='AbortError') say('تشخیص صدا کار نکرد ('+e.message+').'); res(''); }
    };
  });
}

/* ---------- صدا زدن «هی جارویس» ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let listening=false,busy=false,rec=null;

function isWakeTok(w){ return /jarvis|ژارویس|جارویس|جاروس|جاراویس|جارویز/.test(w)||sim(w,'جارویس')>=0.7; }
function findWake(t){ const tk=norm(t).split(' ').filter(Boolean); const i=tk.findIndex(isWakeTok); return i<0?null:tk.slice(i+1).join(' '); }

function startWake(){
  if(!listening||busy) return;
  if(!SR){ setState('', 'این مرورگر گوش دادن همیشگی نداره (کروم رو امتحان کن)'); return; }
  rec=new SR(); rec.lang='fa-IR'; rec.continuous=true; rec.interimResults=false;
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(!e.results[i].isFinal) continue;
      const rest=findWake(e.results[i][0].transcript);
      if(rest!==null){ onWake(rest); return; }
    }
  };
  rec.onerror=e=>{ if(e.error==='not-allowed'||e.error==='service-not-allowed'){ listening=false; setState('','دسترسی میکروفون داده نشد'); } };
  rec.onend=()=>{ if(listening&&!busy) setTimeout(startWake,300); };
  try{ rec.start(); setState('wake','منتظر «هی جارویس»…'); }catch(e){}
}

async function onWake(rest){
  if(busy||running) return;
  busy=true; try{ rec.onend=null; rec.stop(); }catch(e){}
  beep();
  await run(async()=>{
    let cmd=rest;
    if(!cmd){
      if(!getKey()) return;
      setState('listen','گوش می‌دم…');
      try{ cmd=await recordCommand(); }catch(e){ cmd=''; say('به میکروفون دسترسی نداشتم.'); }
    }
    chk();
    if(cmd){ setState('think','در حال پردازش…'); await process(cmd); }
  });
  busy=false;
  if(listening) startWake();
}

orb.onclick=async()=>{
  if(listening){ listening=false; try{ rec.onend=null; rec.stop(); }catch(e){} setState('','دکمه‌ی صدا رو بزن تا گوش بدم'); return; }
  try{ const s=await navigator.mediaDevices.getUserMedia({audio:true}); s.getTracks().forEach(t=>t.stop()); }
  catch(e){ return say('به میکروفون دسترسی نداشتم. اجازه‌ی میکروفون رو بده یا تایپ کن.'); }
  listening=true; startWake();
};

const keybtn=document.getElementById('keybtn'), keypanel=document.getElementById('keypanel'), keyin=document.getElementById('keyin');

function sendTxt(){
  if(running) return;
  const v=txt.value.trim(); if(!v) return;
  txt.value=''; run(()=>process(v));
}
