<!DOCTYPE html>
<html lang="fa" dir="rtl" translate="no" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="google" content="notranslate">
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#030507;--side:rgba(7,11,17,.86);--text:#dce9f2;--mute:#7f93a3;--line:rgba(25,227,255,.16);--bubble:rgba(25,227,255,.075);--accent:#19e3ff;--accent2:#8b5cff;--card:rgba(9,15,22,.80);--hover:rgba(25,227,255,.09);--ok:#37f0a0;--bad:#ff5d73;--onaccent:#021014;--glow:0 0 22px rgba(25,227,255,.28)}
:root[data-theme=light]{--bg:#f1f6f8;--side:rgba(255,255,255,.88);--text:#0d1b24;--mute:#5d7280;--line:rgba(0,120,150,.22);--bubble:rgba(0,150,190,.09);--accent:#0891b2;--accent2:#6d4aff;--card:rgba(255,255,255,.92);--hover:rgba(0,150,190,.10);--ok:#16a34a;--bad:#dc2626;--onaccent:#fff;--glow:0 0 16px rgba(8,145,178,.16)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Vazirmatn,system-ui,-apple-system,Tahoma,sans-serif;color:var(--text);overflow:hidden;-webkit-tap-highlight-color:transparent;
 background:radial-gradient(900px 520px at 88% -12%,rgba(25,227,255,.11),transparent 60%),radial-gradient(760px 520px at -12% 112%,rgba(139,92,255,.11),transparent 60%),var(--bg)}
:root[data-theme=light] body{background:radial-gradient(900px 520px at 88% -12%,rgba(8,145,178,.10),transparent 60%),var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(25,227,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(25,227,255,.04) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 78%)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(25,227,255,.25);border-radius:6px}
button{border:0;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;color:inherit;background:none}
input,textarea,select{font-family:inherit}
svg{display:block}
#app{display:flex;height:100dvh;position:relative;z-index:1}
#side{width:290px;flex:none;background:var(--side);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));gap:8px;transition:transform .25s}
.sh{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 6px}
.brand{display:flex;align-items:center;gap:10px}
.bt{font-family:Orbitron,system-ui,sans-serif;font-weight:800;letter-spacing:.28em;font-size:15px;color:#eafcff;text-shadow:0 0 14px rgba(25,227,255,.7)}
:root[data-theme=light] .bt{color:var(--accent);text-shadow:none}
.logo{width:26px;height:26px;color:var(--accent);filter:drop-shadow(0 0 7px var(--accent))}
.logo svg{width:26px;height:26px}
.newbtn{gap:8px;justify-content:flex-start;padding:10px 12px;border-radius:12px;font-size:15px;color:var(--accent);font-weight:500;border:1px solid var(--line)}
.newbtn:hover{background:var(--hover);box-shadow:var(--glow)}
.newbtn svg{width:20px;height:20px}
.hsearch{margin:0 2px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px;font-size:14px;outline:none}
.hsearch:focus{border-color:var(--accent)}
#hist{flex:1;overflow-y:auto;padding-top:4px}
.hg{font-size:11.5px;color:var(--mute);padding:12px 12px 4px;letter-spacing:.04em}
.hi{display:flex;align-items:center;gap:2px;padding:2px 4px 2px 8px;border-radius:10px;cursor:pointer;border-inline-start:2px solid transparent}
.hi:hover{background:var(--hover)}
.hi.on{background:var(--hover);border-inline-start-color:var(--accent);box-shadow:inset 0 0 18px rgba(25,227,255,.06)}
.hi span{flex:1;min-width:0;padding:8px 6px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi button{width:28px;height:28px;border-radius:8px;color:var(--mute);opacity:.55}
.hi button:hover{opacity:1;background:var(--line)}
.hi svg{width:15px;height:15px}
.prof{gap:10px;padding:8px;border-radius:12px;justify-content:flex-start;text-align:start;width:100%;border:1px solid transparent}
.prof:hover{background:var(--hover);border-color:var(--line)}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onaccent);display:flex;align-items:center;justify-content:center;font-weight:700}
.pn{flex:1;display:flex;flex-direction:column;line-height:1.4;font-size:14px}
.pn small{color:var(--accent);font-size:10.5px;font-family:Orbitron,system-ui,sans-serif;letter-spacing:.14em}
.prof svg{width:20px;height:20px;color:var(--mute)}
#scrim{display:none}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#top{position:absolute;top:0;inset-inline:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;pointer-events:none;background:linear-gradient(180deg,rgba(3,5,7,.78),rgba(3,5,7,0))}
:root[data-theme=light] #top{background:linear-gradient(180deg,rgba(241,246,248,.9),rgba(241,246,248,0))}
#top>*{pointer-events:auto}
#brandWrap{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
#brandTop{font-family:Orbitron,system-ui,sans-serif;font-weight:800;letter-spacing:.5em;padding-inline-start:.5em;font-size:16px;color:#eafcff;text-shadow:0 0 12px rgba(25,227,255,.9),0 0 30px rgba(25,227,255,.45)}
:root[data-theme=light] #brandTop{color:var(--accent);text-shadow:none}
#ttl{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;min-height:15px}
#menuBtn{display:none}
#wakeInd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--accent)}
#wakeInd[hidden]{display:none}
#wakeInd i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:pulse 1.4s ease-in-out infinite}
.ib{width:38px;height:38px;border-radius:10px;color:var(--mute);flex:none}
.ib:hover{background:var(--hover);color:var(--accent)}
.ib svg{width:20px;height:20px}
#home{display:none;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:0 20px 16px}
.mark{position:relative;width:86px;height:86px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.mark .brain svg{width:44px;height:44px;filter:drop-shadow(0 0 10px var(--accent))}
.mark::before,.mark::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.mark::before{inset:0;border:1px dashed rgba(25,227,255,.5);animation:spin 16s linear infinite}
.mark::after{inset:10px;border:1px solid transparent;border-top-color:var(--accent);border-bottom-color:var(--accent2);animation:spin 5s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.sys{display:flex;align-items:center;gap:8px;font-family:Orbitron,system-ui,sans-serif;font-size:11px;letter-spacing:.3em;color:var(--accent)}
.sys i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.8s ease-in-out infinite}
#home h2{margin:0;font-weight:500;font-size:clamp(26px,5.5vw,38px);background:linear-gradient(90deg,#ffffff,#8fefff 60%,#b9a4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme=light] #home h2{background:none;color:var(--text)}
body.empty #home{display:flex}
body.empty #scroller{display:none}
body.empty #main{justify-content:center}
#scroller{flex:1;overflow-y:auto;padding:70px 0 14px}
#log{width:100%;max-width:760px;margin:0 auto;padding:0 18px;display:flex;flex-direction:column;gap:22px}
.msg{display:flex;flex-direction:column;gap:6px;animation:in .28s ease}
.msg.user{align-items:flex-start}
.ub{background:var(--bubble);border:1px solid var(--line);padding:10px 16px;border-radius:18px;max-width:88%;white-space:pre-wrap;line-height:1.9;font-size:16px;word-break:break-word}
.uatts{display:flex;flex-wrap:wrap;gap:8px;max-width:88%}
.uimg{width:120px;height:120px;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.fchip{background:var(--bubble);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px}
.ab{font-size:16.5px;line-height:2;word-break:break-word}
.acts{display:flex;gap:2px;opacity:.55}
.acts button{width:30px;height:30px;border-radius:8px;color:var(--mute)}
.acts button:hover{background:var(--hover);color:var(--accent)}
.acts svg{width:16px;height:16px}
.msg:hover .acts{opacity:1}
.src{display:flex;flex-wrap:wrap;gap:6px}
.src a,.gbtn{font-size:12.5px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:4px 12px;text-decoration:none;background:var(--card);font-family:system-ui,sans-serif}
.src a:hover,.gbtn:hover{color:var(--accent);box-shadow:var(--glow)}
.gbtn{align-self:flex-start;font-family:inherit;color:var(--accent)}
.note{font-size:12px;color:var(--mute)}
.errd{font-size:12px;color:var(--mute);direction:ltr;text-align:left;font-family:ui-monospace,monospace;word-break:break-all}
.step{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px;animation:in .25s ease}
.step .ic{width:30px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.step.run .t{background:linear-gradient(90deg,var(--mute) 30%,var(--accent) 50%,var(--mute) 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.8s linear infinite}
.step.ok .ic{color:var(--ok)}.step.fail .ic{color:var(--bad)}
.orbit{position:relative;display:block;width:26px;height:20px}
.orbit i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe2c9,#ff8a3d 55%,#b8470f);box-shadow:0 0 6px rgba(255,138,61,.9),0 0 14px rgba(255,138,61,.45);animation:orb 1.5s linear infinite}
.orbit i:nth-child(2){animation-delay:-.5s}.orbit i:nth-child(3){animation-delay:-1s}
@keyframes orb{
 0%{transform:translate(10px,0) scale(1);opacity:1}
 12.5%{transform:translate(7px,3px) scale(1.2);opacity:1}
 25%{transform:translate(0,4.5px) scale(1.4);opacity:1}
 37.5%{transform:translate(-7px,3px) scale(1.2);opacity:1}
 50%{transform:translate(-10px,0) scale(1);opacity:.9}
 62.5%{transform:translate(-7px,-3px) scale(.75);opacity:.6}
 75%{transform:translate(0,-4.5px) scale(.55);opacity:.4}
 87.5%{transform:translate(7px,-3px) scale(.75);opacity:.6}
 100%{transform:translate(10px,0) scale(1);opacity:1}}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.md p{margin:0 0 12px}.md p:last-child{margin-bottom:0}
.md h4{margin:16px 0 6px;font-size:17px;color:#eafcff}
:root[data-theme=light] .md h4{color:var(--text)}
.md ul,.md ol{margin:0 0 12px;padding-inline-start:26px}
.md li{margin-bottom:4px}
.md a{color:var(--accent)}
.md blockquote{margin:0 0 12px;padding:2px 14px;border-inline-start:3px solid var(--accent);color:var(--mute)}
.md :not(pre)>code{background:var(--bubble);border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:.88em;direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,Consolas,monospace}
.tw{overflow-x:auto;margin:0 0 12px}
.md table{border-collapse:collapse;font-size:14.5px}
.md th,.md td{border:1px solid var(--line);padding:6px 12px}
.md th{background:var(--bubble)}
.code{margin:12px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(0,0,0,.35);font-family:system-ui,sans-serif;box-shadow:0 0 0 1px rgba(25,227,255,.04),var(--glow)}
:root[data-theme=light] .code{background:#fff}
.ch{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);direction:ltr;background:var(--bubble)}
.cb{display:flex;gap:2px;direction:rtl}
.cb button{color:var(--accent);font-size:13px;padding:4px 10px;border-radius:8px}
.cb button:hover{background:var(--hover)}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;direction:ltr;text-align:left;font-size:13px;line-height:1.65;font-family:ui-monospace,Menlo,Consolas,monospace}
.pv{display:block;width:100%;height:340px;border:0;border-top:1px solid var(--line);background:#fff}
.ov{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column}
.ov .ob{display:flex;justify-content:flex-end;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.ov .ob button{background:var(--accent);color:var(--onaccent);border-radius:10px;padding:8px 16px;font-size:14px}
.ov .ob a{background:var(--bubble);color:var(--text);border-radius:10px;padding:8px 16px;font-size:14px;text-decoration:none}
.ov iframe{flex:1;border:0;background:#fff;width:100%}
.ov img{flex:1;min-height:0;object-fit:contain;background:#000}
.gimg{display:block;max-width:min(100%,440px);border-radius:16px;border:1px solid var(--line);cursor:zoom-in;margin-bottom:8px;box-shadow:var(--glow)}
#composerWrap{width:100%;max-width:760px;margin:0 auto;padding:6px 14px calc(8px + env(safe-area-inset-bottom))}
#composer{background:var(--card);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:10px 12px 8px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,box-shadow .2s;box-shadow:0 0 0 1px rgba(25,227,255,.03),0 8px 30px rgba(0,0,0,.35)}
#composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 26px rgba(25,227,255,.25),0 8px 30px rgba(0,0,0,.35)}
#txt{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:16px;line-height:1.8;resize:none;max-height:220px;padding:2px 6px;min-height:30px}
#txt::placeholder{color:var(--mute)}
.crow{display:flex;align-items:center;gap:4px}
.crow .sp{flex:1}
.ver{font-family:Orbitron,system-ui,sans-serif;font-size:10.5px;letter-spacing:.18em;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:5px 11px;margin-inline:4px;text-shadow:0 0 8px rgba(25,227,255,.5)}
:root[data-theme=light] .ver{text-shadow:none}
#primary{width:38px;height:38px;border-radius:50%;flex:none;transition:transform .15s,box-shadow .2s}
#primary:active{transform:scale(.92)}
#primary svg{width:18px;height:18px}
#primary[data-mode=send],#primary[data-mode=stop]{background:linear-gradient(135deg,var(--accent),#2f7bff);color:var(--onaccent);box-shadow:0 0 18px rgba(25,227,255,.5)}
#primary[data-mode=voice]{background:transparent;color:var(--accent);border:1px solid var(--accent);box-shadow:0 0 14px rgba(25,227,255,.3)}
#mic.rec{color:#fff;background:var(--bad);animation:pulse 1.2s ease-in-out infinite}
#mic.busy{opacity:.5}
.foot{text-align:center;font-size:11.5px;color:var(--mute);padding:8px 8px 0}
#atts{display:flex;flex-wrap:wrap;gap:8px}
#atts:empty{display:none}
.att{position:relative;display:flex;align-items:center;gap:8px;background:var(--bubble);border:1px solid var(--line);border-radius:12px;padding:5px 8px;font-size:13px;max-width:210px}
.att img{width:42px;height:42px;object-fit:cover;border-radius:8px}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att button{width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--text)}
.att button svg{width:12px;height:12px}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:14px}
.modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:20px;border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--glow)}
.sht{display:flex;align-items:center;justify-content:space-between;font-size:18px}
.sec{font-size:12px;color:var(--accent);margin-top:8px;border-top:1px solid var(--line);padding-top:12px;letter-spacing:.06em}
.fl{display:flex;flex-direction:column;gap:6px;font-size:14px}
.fl input,.fl textarea,.fl select,.row input{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px;font-size:15px;outline:none}
.fl input:focus,.fl textarea:focus,.fl select:focus,.row input:focus{border-color:var(--accent)}
.fl select option{background:#0b1218;color:#dce9f2}
.fl input[type=range]{padding:0}
.chk{display:flex;align-items:center;gap:10px;font-size:14px}
.chk input{accent-color:var(--accent)}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.btn{background:linear-gradient(135deg,var(--accent),#2f7bff);color:var(--onaccent);border-radius:12px;padding:9px 16px;font-size:14px;font-weight:500}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line);align-self:flex-start}
.vstat{font-size:12.5px;color:var(--mute);min-height:18px;direction:ltr;text-align:left;word-break:break-all}
.mi{display:flex;align-items:center;gap:8px;background:var(--bubble);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:6px}
.mi span{flex:1}
.mi button{color:var(--mute)}
.mi svg{width:16px;height:16px}
.vo{position:fixed;inset:0;z-index:60;background:radial-gradient(700px 500px at 50% 45%,rgba(25,227,255,.10),transparent 65%),var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px;text-align:center}
.vo.show{display:flex}
.vx{position:absolute;top:calc(12px + env(safe-area-inset-top));inset-inline-end:14px}
.vwrap{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.vwrap::before,.vwrap::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.vwrap::before{inset:0;border:1px dashed rgba(25,227,255,.45);animation:spin 18s linear infinite}
.vwrap::after{inset:14px;border:1px solid transparent;border-top-color:var(--accent);border-bottom-color:var(--accent2);animation:spin 6s linear infinite reverse}
.vo.think .vwrap::after{animation-duration:1.4s}
.vorb{width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b8f7ff,var(--accent) 45%,#1b5bff 100%);box-shadow:0 0 70px rgba(25,227,255,.55),inset 0 0 30px rgba(255,255,255,.25);transform:scale(calc(1 + var(--lvl,0)*1.3));transition:transform .08s linear;cursor:pointer}
.vo.think .vorb,.vo.speak .vorb{animation:breath 1.5s ease-in-out infinite;transform:none}
@keyframes breath{0%,100%{transform:scale(.94)}50%{transform:scale(1.08)}}
#vcap{min-height:56px;max-width:560px;font-size:18px;line-height:1.9}
.vhint{font-size:12.5px;color:var(--mute)}
#toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--accent);color:var(--text);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90;max-width:90vw;box-shadow:var(--glow)}
#toast.show{opacity:1}
@media (max-width:820px){
  #side{position:fixed;inset-block:0;inset-inline-start:0;z-index:40;transform:translateX(100%);width:min(310px,86vw)}
  body.menu #side{transform:none}
  body.menu #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30}
  #menuBtn{display:inline-flex}
}
</style>
</head>
<body class="empty">
<div id="app">
 <aside id="side">

/* ---------- ذخیره‌سازی و وضعیت ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}};
function getKey(){let k='';try{k=localStorage.getItem('groqkey')||'';}catch(e){}k=k||GROQ_KEY;return k.startsWith('gsk_')?k:'';}
function getGeminiKey(){let k='';try{k=localStorage.getItem('geminikey')||'';}catch(e){}k=k||GEMINI_KEY;return k.startsWith('AIza')?k:'';}
const settings=Object.assign({name:'',instructions:'',theme:'dark',voiceReplies:true,readAll:false,voiceName:'Charon',speechLang:'auto',wake:false,speed:1},store.get('jv_settings',{}));

function serialize(){

    atts:(m.atts||[]).map(a=>({type:a.type,name:a.name,thumb:a.thumb,text:a.type==='file'?a.text:undefined}))}))}));

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600);}

/* ---------- ابزارهای متن ---------- */
function mkEl(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function norm(s){return s.toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\u064B-\u065F\u200c]/g,' ').replace(/[؟?!.,،]/g,' ').replace(/\s+/g,' ').trim();}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function sim(a,b){const L=Math.max(a.length,b.length);return L?1-lev(a,b)/L:1;}
function stripThink(t){return t.replace(/<think>[\s\S]*?<\/think>/g,'').replace(/<think>[\s\S]*$/,'');}
function clean(t){return t.replace(/【[^】]*】/g,'').replace(/\[\d+\]/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/[*`#>|]+/g,'').replace(/^\s*[-•]\s+/gm,'').replace(/\n{3,}/g,'\n\n').trim();}
function speakable(t){
  const had=/```/.test(t);
  let s=clean(t.replace(/```[\s\S]*?(```|$)/g,' ')).replace(/\s+/g,' ').trim();
  if(s.length>1200)s=s.slice(0,1200)+'…';
  if(had)s+=(s?' ':'')+'کدش رو توی صفحه نوشتم.';
  return s;
}

/* ---------- مارک‌داون و کد ---------- */
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s"'&]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function proseHTML(t){
  const L=t.split('\n'),out=[];let list=null;
  const close=()=>{if(list){out.push('</'+list+'>');list=null;}};
  const isRow=l=>/^\s*\|.*\|\s*$/.test(l);
  for(let i=0;i<L.length;i++){
    const line=L[i];let m;
    if(isRow(line)){
      close();const rows=[];
      while(i<L.length&&isRow(L[i])){rows.push(L[i]);i++;}
      i--;
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));
      const body=rows.filter(r=>!/^\s*\|?[\s:|-]+\|?\s*$/.test(r));
      if(body.length)out.push('<div class="tw"><table><tr>'+cells(body[0]).map(c=>'<th>'+c+'</th>').join('')+'</tr>'+body.slice(1).map(r=>'<tr>'+cells(r).map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table></div>');
      continue;
    }
    if((m=/^\s*>\s?(.*)/.exec(line))){close();out.push('<blockquote dir="auto">'+inline(m[1])+'</blockquote>');}
    else if((m=/^\s*(#{1,4})\s+(.*)/.exec(line))){close();out.push('<h4 dir="auto">'+inline(m[2])+'</h4>');}
    else if((m=/^\s*[-*•]\s+(.*)/.exec(line))){if(list!=='ul'){close();out.push('<ul>');list='ul';}out.push('<li dir="auto">'+inline(m[1])+'</li>');}
    else if((m=/^\s*\d+[.)]\s+(.*)/.exec(line))){if(list!=='ol'){close();out.push('<ol>');list='ol';}out.push('<li dir="auto">'+inline(m[1])+'</li>');}
    else if(!line.trim())close();
    else{close();out.push('<p dir="auto">'+inline(line)+'</p>');}
  }
  close();return out.join('');
}
function copyText(t){
  const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}a.remove();};
  try{navigator.clipboard.writeText(t).catch(fb);}catch(e){fb();}
  toast('کپی شد');
}
function runKind(lang,code){
  if(['html','htm'].includes(lang)||(!lang&&/<!doctype|<html/i.test(code)))return 'html';
  if(['js','javascript'].includes(lang))return 'js';
  return null;
}
function srcdocFor(kind,code){
  if(kind==='html')return code;
  return '<!DOCTYPE html><meta charset="utf-8"><body style="font-family:monospace;padding:10px;background:#fff;color:#111;direction:ltr"><pre id="o" style="white-space:pre-wrap"></pre><script>const o=document.getElementById("o");const p=(...a)=>{o.textContent+=a.map(x=>typeof x==="object"?JSON.stringify(x):String(x)).join(" ")+"\\n"};console.log=p;console.error=(...a)=>p("خطا:",...a);window.onerror=m=>p("خطا:",m);try{\n'+code+'\n}catch(e){p("خطا:",e.message)}<\/script>';
}
function fullscreen(src){
  const ov=mkEl('div','ov'),bar=mkEl('div','ob'),b=mkEl('button');
  b.textContent='بستن';b.onclick=()=>ov.remove();bar.appendChild(b);
  const f=document.createElement('iframe');f.sandbox='allow-scripts allow-forms allow-modals';f.srcdoc=src;
  ov.append(bar,f);document.body.appendChild(ov);
}
function makeCode(lang,code,canRun){
  const wrap=mkEl('div','code'),head=mkEl('div','ch'),label=mkEl('span');
  label.textContent=lang||'code';head.appendChild(label);
  const btns=mkEl('span','cb');head.appendChild(btns);
  const mk=(t,fn)=>{const b=mkEl('button');b.textContent=t;b.onclick=()=>fn(b);btns.appendChild(b);return b;};
  mk('کپی',b=>{copyText(code);b.textContent='کپی شد';setTimeout(()=>{b.textContent='کپی';},1500);});
  const kind=runKind(lang,code);let frame=null;
  if(canRun&&kind){
    mk('تمام‌صفحه',()=>fullscreen(srcdocFor(kind,code)));
    mk('اجرا',b=>{
      if(frame){frame.remove();frame=null;b.textContent='اجرا';}
      else{frame=document.createElement('iframe');frame.className='pv';frame.sandbox='allow-scripts allow-forms allow-modals';frame.srcdoc=srcdocFor(kind,code);wrap.appendChild(frame);b.textContent='بستن';}
    });
  }
  const pre=mkEl('pre'),c=mkEl('code');c.textContent=code;pre.appendChild(c);
  wrap.append(head,pre);return wrap;
}
function renderMD(el,text,final){
  el.textContent='';
  const re=/```([\w+#-]*)[^\n]*\n([\s\S]*?)(```|$)/g;
  let last=0,m;
  const prose=t=>{if(!t.trim())return;const d=mkEl('div');d.innerHTML=proseHTML(t);el.appendChild(d);};
  while((m=re.exec(text))){
    prose(text.slice(last,m.index));
    el.appendChild(makeCode((m[1]||'').toLowerCase(),m[2].replace(/\n$/,''),final&&m[3]==='```'));
    last=m.index+m[0].length;
    if(m[0].length===0)re.lastIndex++;
  }
  prose(text.slice(last));
}

/* ---------- لایه‌ی چت: لاگ، پیام‌ها ---------- */
const log=$('log'),txt=$('txt'),primary=$('primary');
function scrollDown(){const s=$('scroller');s.scrollTop=s.scrollHeight;}
function updateEmpty(){document.body.classList.toggle('empty',!cur||cur.messages.length===0);$('ttl').textContent=(cur&&cur.title)||'';}
function iconBtn(name,fn,title){const b=mkEl('button','',ic(name));b.onclick=fn;if(title)b.title=title;return b;}
function userEl(m){
  const w=mkEl('div','msg user');
  if(m.atts&&m.atts.length){
    const row=mkEl('div','uatts');
    for(const a of m.atts){
      if(a.thumb){const i=mkEl('img','uimg');i.src=a.thumb;row.appendChild(i);}

function addExtras(w,m){
  if(m.sources&&m.sources.length){
    const s=mkEl('div','src');

  }
  if(m.open){const a=mkEl('a','gbtn');a.href=m.open.href;a.textContent=m.open.label;if(!/^intent:/.test(m.open.href)){a.target='_blank';a.rel='noopener';}w.appendChild(a);}
  if(m.google){
    const a=mkEl('a','gbtn');a.href='https://www.google.com/search?q='+encodeURIComponent(m.google);a.target='_blank';a.rel='noopener';a.textContent='جستجو در گوگل';w.appendChild(a);
  }
  if(m.note){const n=mkEl('div','note');n.textContent=m.note;w.appendChild(n);}
  if(m.err){const e=mkEl('div','errd');e.textContent=m.err;w.appendChild(e);}
  const acts=mkEl('div','acts');
  acts.append(iconBtn('copy',()=>copyText(m.text),'کپی'),iconBtn('speaker',()=>readAloud(m.text),'بخون'),iconBtn('retry',()=>regen(m),'دوباره بساز'));
  if(m.img||m.imgFull){const dl=iconBtn('download',()=>{const a=document.createElement('a');a.href=m.imgFull||m.img;a.download='jarvis.png';a.click();},'ذخیره');acts.appendChild(dl);}
  w.appendChild(acts);
}
function asstEl(m){
  const w=mkEl('div','msg asst');
  if(m.img||m.imgFull){const im=mkEl('img','gimg');im.src=m.imgFull||m.img;im.onclick=()=>viewImage(im.src);w.appendChild(im);}
  const b=mkEl('div','ab md');renderMD(b,m.text,true);w.appendChild(b);addExtras(w,m);return w;
}
function viewImage(src){
  const ov=mkEl('div','ov'),bar=mkEl('div','ob');
  const dl=mkEl('a');dl.href=src;dl.download='jarvis.png';dl.textContent='ذخیره';
  const b=mkEl('button');b.textContent='بستن';b.onclick=()=>ov.remove();
  bar.append(dl,b);const im=document.createElement('img');im.src=src;
  ov.append(bar,im);document.body.appendChild(ov);
}
function renderAll(){
  log.textContent='';
  for(const m of cur.messages)log.appendChild(m.role==='user'?userEl(m):asstEl(m));
  updateEmpty();scrollDown();
}
function ensureChat(){if(!cur)newChat();}
function greeting(){
  const h=new Date().getHours();
  const p=h<5?'شب بخیر':h<12?'صبح بخیر':h<16?'ظهر بخیر':h<19?'عصر بخیر':'شب بخیر';
  return settings.name?p+'، '+settings.name:p;
}
function newChat(){
  if(running)stopAll();
  cur={id:uid(),title:'',updated:Date.now(),messages:[]};
  pending=[];renderAtts();renderAll();$('greet').textContent=greeting();updateRows();
  txt.value='';autoGrow();updatePrimary();closeMenu();
}
function loadChat(c){if(running)stopAll();cur=c;renderAll();updateRows();closeMenu();}
function editMsg(m){
  if(running)return;
  const i=cur.messages.indexOf(m);if(i<0)return;
  cur.messages.length=i;pending=(m.atts||[]).slice();
  renderAll();renderAtts();txt.value=m.text||'';autoGrow();updatePrimary();persist();txt.focus();
}
function regen(m){
  if(running)return;
  const i=cur.messages.indexOf(m);if(i<1)return;
  cur.messages.length=i;renderAll();persist();
  const um=cur.messages[i-1];
  run(()=>process(um));
}
let typers=new Set();
function typeOut(b,text){
  return new Promise(res=>{
    let i=0;const step=Math.max(2,Math.ceil(text.length/70));
    const done=()=>{if(!typers.has(done))return;typers.delete(done);clearInterval(t);renderMD(b,text,true);res();};
    typers.add(done);
    const t=setInterval(()=>{i+=step;if(i>=text.length)return done();renderMD(b,text.slice(0,i),false);scrollDown();},24);
  });
}
async function sayAsst(text,opts={}){
  ensureChat();
  const m={role:'assistant',text,sources:opts.sources||[],google:opts.google,err:opts.err,open:opts.open};
  cur.messages.push(m);
  const w=mkEl('div','msg asst'),b=mkEl('div','ab md');
  w.appendChild(b);log.appendChild(w);updateEmpty();
  speak(speakable(text));
  await typeOut(b,text);
  addExtras(w,m);scrollDown();persist();afterAssistant();
}

/* ---------- لغو / اجرا ---------- */
let ctrl=null,running=false;
const sig=()=>(running&&ctrl)?ctrl.signal:undefined;
function chk(){if(running&&ctrl&&ctrl.signal.aborted)throw new DOMException('stopped','AbortError');}
function setRunning(b){running=b;updatePrimary();}
function stopAll(){
  if(running&&ctrl){try{ctrl.abort();}catch(e){}}
  stopSpeech();
  for(const f of [...typers])f();
  for(const s of [...active])s.fail('متوقف شد');
}
async function run(fn){
  if(running)return;
  ctrl=new AbortController();setRunning(true);
  try{await fn();await waitSpeech();}
  catch(e){if(e.name!=='AbortError')console.error(e);}
  finally{setRunning(false);}
}

/* ---------- مرحله‌های وضعیت ---------- */
const active=new Set();
function startStep(text){
  const d=mkEl('div','step run','<span class="ic"><span class="orbit"><i></i><i></i><i></i></span></span><span class="t"></span>');
  d.querySelector('.t').textContent=text;log.appendChild(d);scrollDown();
  const CHECK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
  const CROSS='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const api={};
  const fin=(cls,icon,t)=>{active.delete(api);if(!d.isConnected)return;d.className='step '+cls;d.querySelector('.ic').innerHTML=icon;if(t)d.querySelector('.t').textContent=t;};
  api.set=t=>{if(d.isConnected)d.querySelector('.t').textContent=t;};
  api.done=t=>fin('ok',CHECK,t);
  api.fail=t=>fin('fail',CROSS,t);
  api.remove=()=>{active.delete(api);d.remove();};

}

const M120='openai/gpt-oss-120b',M20='openai/gpt-oss-20b',Q36='qwen/qwen3.6-27b',Q38='qwen/qwen3.8-27b',GFLASH='gemini-2.5-flash';
const GURL='https://api.groq.com/openai/v1/chat/completions';
const BL=store.get('jv_block',{});
function blockModel(m,secs,rate){BL[m]={until:Date.now()+secs*1000,rate:!!rate};store.set('jv_block',BL);}
function blockInfo(m){const b=BL[m];if(!b||b.until<=Date.now())return null;return {wait:(b.until-Date.now())/1000,rate:b.rate};}
function retrySecs(r,text){
  const h=r&&r.headers&&r.headers.get('retry-after');if(h&&!isNaN(+h))return +h;
  const d=/retryDelay"?:\s*"(\d+)/.exec(text||'');if(d)return +d[1];
  const m=/try again in\s+(?:(\d+)h)?\s*(?:(\d+)m(?!s))?\s*(?:([\d.]+)s)?/i.exec(text||'');
  if(m&&(m[1]||m[2]||m[3]))return (+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0);
  return 60;
}
function httpErr(r,t){const e=new Error(r.status+' '+t.slice(0,240));e.status=r.status;e.retry=retrySecs(r,t);return e;}
let lastFinish='';
async function groqRaw(body,useSig=true){
  const r=await fetch(GURL,{method:'POST',signal:useSig?sig():undefined,headers:{'Content-Type':'application/json',Authorization:'Bearer '+getKey()},body:JSON.stringify(body)});
  if(!r.ok)throw httpErr(r,await r.text());
  return r.json();
}
async function groq(messages,opts={}){
  const model=opts.model||MODEL;
  const body={model,temperature:opts.temp??0,messages};
  if(model.startsWith('openai/'))body.reasoning_effort=opts.effort||'low';
  if(opts.json)body.response_format={type:'json_object'};
  if(opts.max)body.max_completion_tokens=opts.max;
  const j=await groqRaw(body,!opts.noAbort);
  return stripThink(j.choices[0].message.content||'').trim();
}
async function groqStream(model,messages,opts,onDelta){
  lastFinish='';
  const body={model,temperature:opts.temp??0.6,messages,stream:true};
  if(model.startsWith('openai/'))body.reasoning_effort=opts.effort||'medium';
  if(opts.max)body.max_completion_tokens=opts.max;
  const r=await fetch(GURL,{method:'POST',signal:sig(),headers:{'Content-Type':'application/json',Authorization:'Bearer '+getKey()},body:JSON.stringify(body)});
  if(!r.ok)throw httpErr(r,await r.text());
  const reader=r.body.getReader(),dec=new TextDecoder();
  let buf='',full='';
  while(true){
    const {done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(!line.startsWith('data:'))continue;
      const d=line.slice(5).trim();if(!d||d==='[DONE]')continue;
      try{const c=JSON.parse(d).choices[0];if(c.finish_reason)lastFinish=c.finish_reason;const t=c.delta&&c.delta.content;if(t){full+=t;onDelta(full);}}catch(e){}
    }
  }
  return full;
}
async function geminiText(list,{json=false,search=false,max=3000}={}){
  const key=getGeminiKey();
  let sys='';const contents=[];
  for(const m of list){
    if(m.role==='system'){sys+=(sys?'\n':'')+m.content;continue;}
    const parts=typeof m.content==='string'?[{text:m.content}]:m.content.map(c=>{
      if(c.type==='text')return {text:c.text};
      const d=dataParts(c.image_url.url)||{mime:'image/jpeg',data:''};
      return {inlineData:{mimeType:d.mime,data:d.data}};
    });
    contents.push({role:m.role==='assistant'?'model':'user',parts});
  }
  const body={contents,generationConfig:{maxOutputTokens:max}};
  if(json||search===false)body.generationConfig.thinkingConfig={thinkingBudget:json?0:512};
  if(sys)body.systemInstruction={parts:[{text:sys}]};
  if(json)body.generationConfig.responseMimeType='application/json';
  if(search)body.tools=[{google_search:{}}];
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+GFLASH+':generateContent?key='+key,{method:'POST',signal:sig(),headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw httpErr(r,await r.text());
  const j=await r.json();const c=j.candidates&&j.candidates[0];
  const text=((c&&c.content&&c.content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||'').join('').trim();
  const sources=[],seen=new Set();
  const gm=c&&c.groundingMetadata;
  if(gm&&gm.groundingChunks)for(const g of gm.groundingChunks){
    if(!g.web||!g.web.uri)continue;
    const host=(g.web.title||'').replace(/^www\./,'')||'منبع';
    if(seen.has(host))continue;seen.add(host);
    sources.push({title:g.web.title||host,url:g.web.uri,host});
    if(sources.length>=6)break;
  }
  return {text,sources};
}
/* زنجیره‌ی مدل‌ها: اگه سهمیه‌ی یکی پر شد، خودکار میره سراغ بعدی */
async function runChain(chain,call){
  let lastErr=null,minWait=Infinity;
  for(const mm of chain){
    if(mm.gem&&!getGeminiKey())continue;
    const bi=blockInfo(mm.id);
    if(bi){if(bi.rate)minWait=Math.min(minWait,bi.wait);continue;}
    try{return await call(mm);}
    catch(e){
      if(e.name==='AbortError')throw e;
      lastErr=e;
      if(e.status===401)throw e;
      if(e.status===429){const s=e.retry||60;blockModel(mm.id,s,true);minWait=Math.min(minWait,s);continue;}
      if([400,403,404].includes(e.status)){blockModel(mm.id,300,false);continue;}
      if(e.status===413||e.status>=500||e.soft)continue;
      throw e;
    }
  }
  if(minWait<Infinity){const e=new Error('all models are rate limited');e.status=429;e.retry=minWait;throw e;}
  throw lastErr||new Error('no model available');
}
const estTok=list=>Math.ceil(list.reduce((n,m)=>n+(typeof m.content==='string'?m.content.length/2.6:m.content.reduce((k,c)=>k+(c.type==='text'?c.text.length/2.6:900),0)),0));
function fitList(list){const lo=list[0]&&list[0].role==='system'?1:0;while(estTok(list)>4200&&list.length>lo+1)list.splice(lo,1);}

/* ---------- جستجوی وب (مثل کلود: چند جستجو، چند منبع، منبع‌ها زیر جواب) ---------- */
function collectSources(msg){
  const out=[],seen=new Set();
  for(const t of (msg.executed_tools||[])){
    const rs=(t.search_results&&t.search_results.results)||[];
    for(const r of rs){
      if(!r.url)continue;let host='';
      try{host=new URL(r.url).hostname.replace(/^www\./,'');}catch(e){continue;}
      if(seen.has(host))continue;seen.add(host);
      out.push({title:r.title||host,url:r.url,host});
      if(out.length>=6)return out;
    }
  }
  return out;
}
async function webSearch(q,orig){
  const n=nowInfo();
  const sys=`You are the web research engine of JARVIS, a Persian assistant. Today is ${n.en} (${n.fa}), the time is ${n.time} and the user's timezone is ${n.tz}. Resolve words like today, tomorrow and yesterday using this date.
Search the web thoroughly: run more than one search when needed, in English and in Persian, open the best sources and cross-check them. Prefer official and recent sources. For sports fixtures give the competition, the date and kickoff time (converted to the user's timezone when you can, otherwise say which timezone), and the venue. For prices give the number, the unit and when it was published. If sources disagree or you cannot verify something, say so clearly instead of guessing.
Answer in friendly, natural Persian (or English if the question is in English), short and clear (2 to 6 sentences). Do not add citation marks or a source list (sources are shown separately).`;
  const messages=[{role:'system',content:sys},{role:'user',content:(orig&&orig!==q)?orig+'\n(search query: '+q+')':q}];
  const chain=[{id:M120,t:'bs'},{id:M20,t:'bs'},{id:GFLASH,gem:true},{id:'groq/compound',t:'cp'},{id:'groq/compound-mini',t:'cp'}];
  return runChain(chain,async mm=>{
    if(mm.gem){
      const r=await geminiText(messages,{search:true,max:2500});chk();
      if(!r.text){const e=new Error('empty');e.soft=true;throw e;}
      return r;
    }
    const body={model:mm.id,messages,temperature:0.3,max_completion_tokens:1500};
    if(mm.t==='bs'){body.tools=[{type:'browser_search'}];body.tool_choice='required';body.reasoning_effort='medium';}
    const j=await groqRaw(body);chk();
    const msg=j.choices[0].message;
    const text=stripThink(msg.content||'').replace(/【[^】]*】/g,'').trim();
    if(!text){const e=new Error('empty');e.soft=true;throw e;}
    return {text,sources:collectSources(msg)};
  });
}
async function search(q,orig){
  const s1=startStep('در حال جستجو در وب: «'+q+'»…');
  speak('یه لحظه، دارم توی اینترنت می‌گردم');
  let out=null,err=null;
  try{out=await webSearch(q,orig);}catch(e){if(e.name==='AbortError')throw e;err=e;}
  chk();
  if(out&&out.text){
    s1.done('جستجوی وب انجام شد'+(out.sources.length?' ('+out.sources.length+' منبع)':''));
    return sayAsst(out.text,{sources:out.sources});
  }

  const quota=err&&err.status===429;
  return sayAsst((quota?failText(err)+' ':'')+'نمی‌خوام حدس بزنم؛ اگه دوست داری خودت توی گوگل ببینی، دکمه‌ی زیر رو بزن.',{google:q,err:err?String(err.message).slice(0,200):''});
}

function buildApi(fixed){
  const msgs=cur.messages.slice(-12);let vision=false;
  let sys=sysChat();
  if(fixed)sys+='\n\nNote: the last user message may contain typos or speech-recognition mistakes. Most likely intended meaning: "'+fixed+'". Answer that meaning; only if it is truly ambiguous, briefly say what you understood.';
  const list=[{role:'system',content:sys}];
  let lastImg=-1;
  msgs.forEach((m,i)=>{if(m.role==='user'&&i>=msgs.length-4&&(m.atts||[]).some(a=>a.full||a.frames))lastImg=i;});
  msgs.forEach((m,i)=>{
    if(m.role==='assistant'){const old=i<msgs.length-2&&m.text.length>1500;list.push({role:'assistant',content:(old?m.text.slice(0,1500)+'…':m.text)+(m.imgPrompt?' [عکسی که ساختی: '+m.imgPrompt+']':'')});return;}
    let text=m.text||'';const imgs=[];
    for(const a of (m.atts||[])){
      if(a.type==='file'){const cut=a.text.length>14000;text+='\n\n[فایل پیوست: '+a.name+(cut?' — فقط ابتدای فایل (۱۴ هزار کاراکتر) فرستاده شده':'')+']\n```\n'+a.text.slice(0,14000)+'\n```';}
      else if((a.full||a.frames)&&i===lastImg){
        imgs.push(...(a.frames||[a.full]));
        if(a.type==='video')text+='\n\n[ویدیوی پیوست: '+a.name+' — چند فریم از ویدیو ضمیمه شده]';
      }else text+='\n\n[پیوست: '+a.name+' (قبلاً دیده شد)]';
    }
    if(imgs.length){vision=true;list.push({role:'user',content:[...imgs.slice(0,5).map(u=>({type:'image_url',image_url:{url:u}})),{type:'text',text:text||'این رو ببین و بگو چیه'}]});}
    else list.push({role:'user',content:text});
  });
  if(vision){
    const s0=list.shift().content;
    for(let i=list.length-1;i>=0;i--)if(list[i].role==='user'&&Array.isArray(list[i].content)){
      const t=list[i].content.find(c=>c.type==='text');t.text='<instructions>\n'+s0+'\n</instructions>\n\nThe image(s) above are attached to this message and you CAN see them. Look at them carefully and answer based on what you actually see.\n\n'+t.text;break;
    }
  }
  return {list,vision};
}
const BLIND=/(نمی‌?تونم|نمیتونم|قادر نیستم|امکان ندارد).{0,40}(عکس|تصویر|ببینم)|can'?t (see|view|access)|cannot (see|view)|unable to (see|view)/i;

  const max=Math.max(700,Math.min(want,7600-est));
  let chain=vision?[{id:Q36},{id:Q38},{id:GFLASH,gem:true}]
    :effort==='low'?[{id:M20},{id:M120},{id:Q36},{id:GFLASH,gem:true}]
    :[{id:M120},{id:Q38},{id:M20},{id:GFLASH,gem:true}];
  if(est>5200&&getGeminiKey())chain=[{id:GFLASH,gem:true},...chain];
  let w=null,b=null,partial='',raf=false,fin=false,blind='',served='';
  const mk=()=>{if(!w){if(think)think.remove();w=mkEl('div','msg asst');b=mkEl('div','ab md');w.appendChild(b);log.appendChild(w);}};
  const drop=()=>{if(w){w.remove();w=null;b=null;}partial='';};
  const onDelta=t=>{partial=stripThink(t);if(!partial.trim())return;mk();
    if(!raf){raf=true;requestAnimationFrame(()=>{raf=false;if(fin||!b)return;renderMD(b,partial,false);scrollDown();});}};
  try{
    let full='';
    try{
      full=await runChain(chain,async mm=>{
        drop();let t;lastFinish='';served=mm.id;
        if(mm.gem){t=(await geminiText(list,{max:4000})).text;if(t)onDelta(t);}
        else t=await groqStream(mm.id,list,{temp:.6,effort,max},onDelta);
        if(vision&&BLIND.test(stripThink(t))){blind=t;const e=new Error('blind');e.soft=true;throw e;}
        return t;
      });
    }catch(e){if(blind&&e.name!=='AbortError')full=blind;else throw e;}
    chk();fin=true;
    let reply=stripThink(full).trim()||'ببخشید، جوابی نداشتم. دوباره بپرس.';
    if(lastFinish==='length')reply+='\n\n(جواب بخاطر محدودیت طول نصفه موند؛ بگو «ادامه بده».)';
    mk();
    const m={role:'assistant',text:reply,sources:[]};
    if(effort!=='low'&&served===M20)m.note='سهمیه‌ی مدل قوی‌تر فعلاً پر بود؛ این جواب با مدل سبک‌تر داده شد.';
    else if(served===GFLASH)m.note='سهمیه‌ی Groq پر بود؛ این جواب با Gemini داده شد.';
    cur.messages.push(m);
    renderMD(b,reply,true);addExtras(w,m);scrollDown();persist();
    speak(speakable(reply));
  }catch(e){
    fin=true;
    if(e.name==='AbortError'&&w&&partial.trim()){
      const m={role:'assistant',text:partial,sources:[]};cur.messages.push(m);
      renderMD(b,partial,true);addExtras(w,m);persist();
    }else if(w)w.remove();
    throw e;
  }
}

let customApps=store.get('jv_apps',[]);
const allApps=()=>APPS.concat(customApps.map(a=>({names:[a.name],pkg:a.pkg,web:'',custom:true})));
const isAndroid=()=>/Android/i.test(navigator.userAgent);
const squash=t=>norm(t).replace(/\s/g,'');
function findApp(name){
  const n=squash(name);if(!n)return null;
  let best=null,bs=0;
  for(const a of allApps())for(const k of a.names){
    const kk=squash(k);
    const sc=kk===n?1:sim(n,kk);
    if(sc>bs){bs=sc;best=a;}
  }
  return bs>=0.78?best:null;
}
const OPEN_VERB=/(^|\s)(باز|بازکن|بازش|اجرا|اجرای|open|launch|start|run)(\s|$)/i;
const OPEN_STOP=new Set(['رو','را','لطفا','برام','یه','یک','کن','باز','بازکن','بازش','اجرا','اجرای','برنامه','اپ','اپلیکیشن','app','open','launch','start','run','please','the','my','برو','توی','تو','به','جارویس','jarvis','hey','هی','کن','و','من','ی']);
function localOpen(raw){
  const t=norm(raw);
  if(!OPEN_VERB.test(t))return null;
  const w=t.split(' ').filter(x=>x&&!OPEN_STOP.has(x));
  if(!w.length||w.length>4)return null;
  const whole=findApp(w.join(' '));if(whole)return whole;
  for(let len=Math.min(3,w.length);len>=1;len--)for(let i=0;i+len<=w.length;i++){const a=findApp(w.slice(i,i+len).join(' '));if(a)return a;}
  return null;
}
function appHref(app){
  if(isAndroid()&&(app.pkg||app.action)){
    const fb=app.web?';S.browser_fallback_url='+encodeURIComponent(app.web):'';
    return app.action?'intent:#Intent;action='+app.action+fb+';end'
      :'intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package='+app.pkg+fb+';end';
  }
  return app.web||'';
}
async function launchApp(app,en){
  const fa=app.names[0],enName=app.names.find(n=>/^[a-z]/i.test(n))||fa;
  const href=appHref(app);
  if(!href)return sayAsst(en?'I can only open "'+enName+'" on an Android phone.':'«'+fa+'» رو فقط روی گوشی اندروید می‌تونم باز کنم.');
  await sayAsst(en?'Opening '+enName+'. If it does not open by itself, tap the button below.':fa+' رو باز می‌کنم. اگه خودش باز نشد، دکمه‌ی زیر رو بزن.',{open:{label:en?'Open '+enName:'باز کردن '+fa,href}});
  if(isAndroid())location.href=href;else window.open(href,'_blank');
}
async function openApp(name,raw){
  const en=isEn(raw||name||'');
  const app=findApp(name)||localOpen(name);
  if(!app)return sayAsst(en?'I could not find that app in my list. Add it in Settings under "My apps" with its package name and I will open it.':'این برنامه رو توی لیستم پیدا نکردم. از تنظیمات، بخش «برنامه‌های من»، اسمش و اسم بسته‌اش رو اضافه کن تا بتونم باز کنم.');
  return launchApp(app,en);
}

/* ---------- ساخت و ادیت عکس (Gemini) ---------- */
function dataParts(url){const m=/^data:([^;]+);base64,(.*)$/.exec(url);return m?{mime:m[1],data:m[2]}:null;}
function findSourceImage(msg){
  for(const a of (msg.atts||[]))if(a.type==='image'&&a.full)return a.full;
  for(let i=cur.messages.length-1;i>=0;i--){
    const m=cur.messages[i];
    if(m.role==='assistant'&&(m.imgFull||m.img))return m.imgFull||m.img;
    for(const a of (m.atts||[]))if(a.type==='image'&&(a.full||a.thumb))return a.full||a.thumb;
  }
  return null;
}
async function geminiImage(kind,prompt,src){
  const key=getGeminiKey();
  const text=kind==='edit'
    ?'Edit the provided image. Keep everything that was not mentioned exactly the same: the same faces and identity, clothes, pose, lighting, perspective, background and image quality. Make the change look photorealistic and seamlessly blended with the original (matching light, shadows, scale and color). The requested change: '+prompt
    :'Create a high-quality, detailed image: '+prompt;
  const parts=[{text}];
  if(kind==='edit'){const d=dataParts(src);if(!d)throw new Error('bad source image');parts.push({inlineData:{mimeType:d.mime,data:d.data}});}
  const errs=[];
  for(const model of ['gemini-2.5-flash-image','gemini-2.5-flash-image-preview']){
    try{
      const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+key,{method:'POST',signal:sig(),headers:{'Content-Type':'application/json'},
        body:JSON.stringify({contents:[{parts}],generationConfig:{responseModalities:['TEXT','IMAGE']}})});
      if(!r.ok){const e=new Error(r.status+' '+(await r.text()).slice(0,260));e.status=r.status;throw e;}
      const j=await r.json();
      const ps=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
      const img=ps.find(x=>x.inlineData||x.inline_data);
      if(img){const d=img.inlineData||img.inline_data;return {url:'data:'+(d.mimeType||d.mime_type||'image/png')+';base64,'+d.data};}
      const e=new Error('no image returned');e.refusal=ps.map(x=>x.text||'').join(' ').trim().slice(0,200);throw e;
    }catch(e){
      if(e.name==='AbortError')throw e;
      if(e.refusal!==undefined||e.status===400||e.status===401||e.status===403)throw e;
      errs.push(model+': '+String(e.message).slice(0,120));
      if(model.endsWith('preview'))throw new Error(errs.join(' | '));
    }
  }
}
function imageFail(e){
  if(e.refusal)return 'مدل این یکی رو نساخت'+(e.refusal?': '+e.refusal:'')+'. یه جور دیگه توضیح بده تا دوباره امتحان کنم.';
  const s=e.status;
  if(s===400&&/API key/i.test(e.message))return 'کلید Gemini درست نیست. از دکمه‌ی کلید یه کلید جدید بذار.';
  if(s===403)return 'Gemini از این کلید یا منطقه جواب نمی‌ده. VPN رو چک کن و مطمئن شو کلید فعاله.';
  if(s===429)return 'سهمیه‌ی رایگان ساخت عکس توی Gemini پر شده یا برای کلیدت فعال نیست. بعداً دوباره امتحان کن.';
  return 'نتونستم عکس رو بسازم. اینترنت و VPN رو چک کن و دوباره بگو.';
}
async function makeThumb(url,max){const i=await loadImage(url);return drawScaled(i,i.naturalWidth,i.naturalHeight,max,.75);}
async function imageTask(kind,prompt,msg){
  if(!getGeminiKey()){
    if(SHOW_KEY_BUTTON)openKeySheet();
    return sayAsst('برای ساختن و ادیت عکس یه کلید رایگان Gemini لازم دارم. از aistudio.google.com/apikey بگیرش و با دکمه‌ی کلید (بالای صفحه) اضافه‌ش کن.');
  }
  let src=null;
  if(kind==='edit'){src=findSourceImage(msg);if(!src)return sayAsst('کدوم عکس؟ یه عکس بفرست تا روش کار کنم.');}
  const step=startStep(kind==='edit'?'در حال ادیت عکس…':'در حال ساختن عکس…');
  speak('یه لحظه، دارم روش کار می‌کنم');
  try{
    const out=await geminiImage(kind,prompt,src);chk();
    step.done('عکس آماده شد');
    ensureChat();
    const thumb=await makeThumb(out.url,512);
    const lines=['بفرما، آماده شد.','این شد؛ ببین چطوره.','تموم شد، نظرت چیه؟'];
    const m={role:'assistant',text:lines[Math.floor(Math.random()*lines.length)],img:thumb,imgFull:out.url,imgPrompt:prompt,sources:[]};
    cur.messages.push(m);log.appendChild(asstEl(m));updateEmpty();scrollDown();persist();speak(m.text);afterAssistant();
  }catch(e){
    if(e.name==='AbortError')throw e;
    step.fail('کار روی عکس ناموفق بود');
    return sayAsst(imageFail(e),{err:String(e.message).slice(0,220)});
  }
}

/* ---------- پردازش پیام ---------- */
function parseIntent(s){try{return JSON.parse(s);}catch(e){return {intent:'chat'};}}
function waitText(s){s=Math.ceil(s);if(s<90)return 'حدود '+s+' ثانیه';if(s<5400)return 'حدود '+Math.ceil(s/60)+' دقیقه';return 'حدود '+Math.ceil(s/3600)+' ساعت';}
function failText(e){
  const s=e.status;
  if(s===401)return 'کلید درست نیست یا منقضی شده. از دکمه‌ی کلید، یه کلید جدید بذار.';
  if(s===429)return 'سهمیه‌ی رایگان همه‌ی مدل‌ها فعلاً پر شده؛ '+waitText(e.retry||60)+' دیگه دوباره باز میشه.'+(getGeminiKey()?'':' اگه کلید Gemini هم اضافه کنی، سهمیه‌ی جدا و بیشتری داری.');
  if(s===413)return 'این گفتگو یا فایل برای سهمیه‌ی دقیقه‌ای رایگان زیادی بزرگه. یه گفتگوی جدید شروع کن یا فایل کوچیک‌تری بفرست.';
  if(s>=500)return 'سرور الان مشکل داره. یه کم دیگه دوباره بفرست.';
  return 'نتونستم به مغزم وصل بشم. اینترنت و VPN رو چک کن و دوباره بفرست.';
}
async function classify(payload){
  const messages=[{role:'system',content:SYS_INTENT},{role:'user',content:JSON.stringify(payload)}];
  return runChain([{id:M20},{id:M120},{id:GFLASH,gem:true}],async mm=>{
    if(mm.gem)return (await geminiText(messages,{json:true,max:500})).text;
    return groq(messages,{model:mm.id,json:true,max:500});
  });
}
async function process(msg){
  if(!getKey()){if(SHOW_KEY_BUTTON)openKeySheet();return sayAsst('برای شروع، کلید Groq رو با دکمه‌ی کلید بالای صفحه وارد کن تا بتونیم حرف بزنیم.');}
  const think=startStep('در حال فکر کردن…');
  try{
    const raw=msg.text||'',atts=msg.atts||[];
    const hasMedia=atts.some(a=>a.type==='image'||a.type==='video');
    if(atts.length&&!(hasMedia&&raw))return await chat(msg,think,{});
    if(!askedOptions&&!atts.length){const k=fastLocal(raw);if(k){think.remove();return await ACTIONS[k](isEn(raw));}}
    if(!askedOptions&&!atts.length){const ap=localOpen(raw);if(ap){think.remove();return await launchApp(ap,isEn(raw));}}
    const recent=cur.messages.slice(-5,-1).map(m=>({role:m.role,text:(m.text||'').slice(0,300)}));
    const res=parseIntent(await classify({text:raw,pending_question_options:askedOptions,recent,has_attachment:hasMedia}));
    chk();
    askedOptions=null;
    const p=(res.param||'').trim();
    const o={fixed:(res.fixed||'').trim(),effort:['low','medium','high'].includes(res.effort)?res.effort:'medium'};
    if(res.intent!=='chat')think.remove();
    switch(res.intent){
      case 'greet':case 'date':case 'time':case 'dollar':return await ACTIONS[res.intent](isEn(raw));
      case 'weather':return await weather(p);
      case 'search':return await search(p||raw,raw);
      case 'open_app':return await openApp(p||raw,raw);
      case 'image_edit':return await imageTask('edit',p||raw,msg);
      case 'image_gen':return await imageTask('gen',p||raw,msg);
      case 'remember':
        if(p){memory.push({id:uid(),text:p});store.set('jv_memory',memory);}
        return await sayAsst('باشه، یادم می‌مونه.');
      case 'ambiguous':{
        const op=(res.options||[]).filter(x=>LABEL[x]).slice(0,2);
        if(op.length===2){askedOptions=op;return await sayAsst('ببخشید، منظورت «'+LABEL[op[0]]+'» بود یا «'+LABEL[op[1]]+'»؟');}
        return await sayAsst('ببخشید، درست نشنیدم. می‌شه دوباره بگی؟');
      }
      case 'chat':return await chat(msg,think,o);
      default:return await sayAsst('ببخشید، درست نشنیدم. می‌شه دوباره بگی؟');
    }
  }catch(e){
    think.remove();
    if(e.name==='AbortError')throw e;
    return sayAsst(failText(e),{err:String(e.message).slice(0,200)});
  }finally{think.remove();}
}
function submitMsg(msg){
  ensureChat();

  if(!cur.title&&msg.text)cur.title=msg.text.replace(/\s+/g,' ').slice(0,34);
  log.appendChild(userEl(msg));updateEmpty();scrollDown();persist();

  const bucket=c=>{const d=Math.round((t0-new Date(c.updated).setHours(0,0,0,0))/86400000);return d<=0?0:d===1?1:d<=7?2:3;};
  const names=['امروز','دیروز','۷ روز گذشته','قدیمی‌تر'];

const loadImage=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
function drawScaled(src,w,h,max,q){
  const k=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');
  c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',q);
}
async function imgAtt(f){
  const url=URL.createObjectURL(f);
  try{const i=await loadImage(url);return {type:'image',name:f.name||'عکس',full:drawScaled(i,i.naturalWidth,i.naturalHeight,1280,.82),thumb:drawScaled(i,i.naturalWidth,i.naturalHeight,160,.7)};}
  finally{URL.revokeObjectURL(url);}
}
async function vidAtt(f){
  const url=URL.createObjectURL(f);
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;
  try{
    await new Promise((res,rej)=>{v.onloadedmetadata=res;v.onerror=rej;});
    const d=v.duration||1,frames=[];let thumb='';
    for(const p of [.08,.28,.5,.72,.92]){
      v.currentTime=Math.min(d*p,Math.max(0,d-.05));
      await new Promise(res=>{v.onseeked=res;setTimeout(res,1500);});
      frames.push(drawScaled(v,v.videoWidth,v.videoHeight,768,.7));
      if(!thumb)thumb=drawScaled(v,v.videoWidth,v.videoHeight,160,.7);
    }
    return {type:'video',name:f.name||'ویدیو',frames,thumb};
  }finally{URL.revokeObjectURL(url);}
}
const isText=f=>f.type.startsWith('text/')||/\.(txt|md|csv|json|js|ts|py|html|css|xml|ya?ml|java|c|cpp|cs|go|rs|php|sql|sh|log|ini)$/i.test(f.name);
async function addFiles(files){
  for(const f of files){
    try{
      if(f.type.startsWith('image/')||(!f.type&&/\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(f.name)))pending.push(await imgAtt(f));
      else if(f.type.startsWith('video/')){toast('دارم ویدیو رو بررسی می‌کنم…');pending.push(await vidAtt(f));}
      else if(isText(f))pending.push({type:'file',name:f.name,text:(await f.text()).slice(0,60000)});
      else toast('این نوع فایل رو هنوز نمی‌تونم بخونم: '+f.name);
    }catch(e){toast('نتونستم '+f.name+' رو باز کنم');}
  }
  renderAtts();updatePrimary();
}
function renderAtts(){
  const a=$('atts');a.textContent='';
  pending.forEach((p,i)=>{
    const d=mkEl('div','att');
    if(p.thumb){const im=mkEl('img');im.src=p.thumb;d.appendChild(im);}else d.insertAdjacentHTML('beforeend',ic('doc').replace('<svg','<svg width="20" height="20"'));
    const sp=mkEl('span');sp.textContent=p.name;d.appendChild(sp);
    d.appendChild(iconBtn('x',()=>{pending.splice(i,1);renderAtts();updatePrimary();}));
    a.appendChild(d);
  });
}

/* ---------- صدا: ضبط، Whisper ---------- */
let recSignal=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function recordAudio({max=15000,silence=1400,noSpeech=7000,onLevel}={}){
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){return {err:'mic'};}
  const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();
  const an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(stream).connect(an);
  const buf=new Uint8Array(an.fftSize),chunks=[];
  let mr;try{mr=new MediaRecorder(stream);}catch(e){stream.getTracks().forEach(t=>t.stop());return {err:'rec'};}
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recSignal=null;let spoke=false,last=Date.now();const t0=Date.now();
  return new Promise(res=>{
    const iv=setInterval(()=>{
      an.getByteTimeDomainData(buf);let sum=0;
      for(const v of buf){const d=(v-128)/128;sum+=d*d;}
      const rms=Math.sqrt(sum/buf.length),now=Date.now();
      if(onLevel)onLevel(rms);
      if(rms>0.035){spoke=true;last=now;}
      if(recSignal||(spoke&&now-last>silence)||now-t0>max||(!spoke&&now-t0>noSpeech)){clearInterval(iv);if(mr.state!=='inactive')mr.stop();}
    },80);
    mr.onstop=()=>{clearInterval(iv);stream.getTracks().forEach(t=>t.stop());try{ctx.close();}catch(e){}
      res({blob:new Blob(chunks,{type:mr.mimeType}),spoke,cancelled:recSignal==='cancel'});};
    mr.start();
  });
}
async function whisper(blob){
  const fd=new FormData();
  fd.append('file',blob,'voice.webm');fd.append('model','whisper-large-v3');fd.append('temperature','0');
  if(settings.speechLang!=='auto')fd.append('language',settings.speechLang);
  const la=cur&&[...cur.messages].reverse().find(m=>m.role==='assistant');
  fd.append('prompt',(settings.speechLang==='fa'?'گفتگوی فارسی با جارویس. ':'')+(la?la.text.replace(/\s+/g,' ').slice(0,140):''));
  const r=await fetch('https://api.groq.com/openai/v1/audio/transcriptions',{method:'POST',signal:sig(),headers:{Authorization:'Bearer '+getKey()},body:fd});
  if(!r.ok)throw new Error('whisper '+r.status);
  const t=(await r.json()).text.trim();
  if(t.length<2||/زیرنویس|تماشا کردید|مشترک شوید|subtitle/i.test(t))return '';
  return t;
}

/* ---------- صدا: خوندن جواب‌ها (Gemini، صدای مردانه‌ی فارسی؛ یا صدای خود گوشی) ---------- */
let voiceCtx=false,ttsVoice=null,ttsQ=[],ttsBusy=false,ttsEpoch=0,audioCtx=null,curSrc=null,noVoiceWarned=false,ttsErr='';
function pickVoice(){try{ttsVoice=speechSynthesis.getVoices().find(v=>/^fa/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function unlockAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}
document.addEventListener('pointerdown',unlockAudio,{once:true});
function chunkText(t){
  const parts=[];let cur='';
  for(const s of t.split(/(?<=[.!؟?\n])\s*/)){if(!s)continue;if(cur&&(cur+s).length>300){parts.push(cur);cur=s;}else cur+=(cur?' ':'')+s;}
  if(cur)parts.push(cur);return parts;
}
function speakNow(t){
  if(!t)return;
  if(vActive)$('vcap').textContent=t.slice(0,220);
  ttsQ.push(...chunkText(t));pump();
}
function speak(t){if(!t)return;if((voiceCtx&&settings.voiceReplies)||settings.readAll)speakNow(t);}
function readAloud(text){stopSpeech();unlockAudio();speakNow(speakable(text));}
function b64Bytes(b){const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function geminiTTS(text){
  const key=getGeminiKey();if(!key){ttsErr='کلید Gemini وارد نشده';return null;}
  ttsErr='';
  for(const model of ['gemini-2.5-flash-preview-tts','gemini-3.1-flash-tts-preview']){
    try{
      const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({contents:[{parts:[{text:'Say this naturally in a calm, confident, warm male voice. Use native, standard pronunciation of the text\'s language (for Persian: clear standard Tehrani Persian, no foreign accent): '+text}]}],
          generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:settings.voiceName||'Charon'}}}}})});
      if(!r.ok){ttsErr=model+': '+r.status+' '+(await r.text()).replace(/\s+/g,' ').slice(0,140);continue;}
      const j=await r.json();
      const ps=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
      const p=ps.find(x=>x.inlineData||x.inline_data);if(!p){ttsErr=model+': no audio';continue;}
      const d=p.inlineData||p.inline_data;
      return {pcm:b64Bytes(d.data),rate:+((/rate=(\d+)/.exec(d.mimeType||d.mime_type||'')||[])[1]||24000)};
    }catch(e){ttsErr=model+': '+e.message;}
  }
  return null;
}
function playPCM(a){
  return new Promise(res=>{
    unlockAudio();
    try{
      const n=a.pcm.length>>1,buf=audioCtx.createBuffer(1,n,a.rate),ch=buf.getChannelData(0),dv=new DataView(a.pcm.buffer,a.pcm.byteOffset,a.pcm.byteLength);
      for(let i=0;i<n;i++)ch[i]=dv.getInt16(i*2,true)/32768;
      const src=audioCtx.createBufferSource();src.buffer=buf;src.playbackRate.value=settings.speed;src.connect(audioCtx.destination);
      curSrc=src;src.onended=()=>res();src.start();
    }catch(e){ttsErr='پخش صدا: '+e.message;res();}
  });
}
function playBrowser(t){
  return new Promise(res=>{
    if(!ttsVoice){
      if(!noVoiceWarned){noVoiceWarned=true;toast(getGeminiKey()?'صدای Gemini جواب نداد ('+(ttsErr||'؟')+')؛ فقط متن رو می‌نویسم':'برای صدای فارسی، کلید Gemini رو از دکمه‌ی کلید اضافه کن');}
      return res();
    }
    const u=new SpeechSynthesisUtterance(t);u.voice=ttsVoice;u.lang=ttsVoice.lang;u.rate=settings.speed;
    let d=false;const f=()=>{if(!d){d=true;res();}};u.onend=f;u.onerror=f;setTimeout(f,25000);
    try{speechSynthesis.speak(u);}catch(e){f();}
  });
}
async function pump(){
  if(ttsBusy)return;ttsBusy=true;const ep=ttsEpoch;
  let cache=null;
  const prep=t=>getGeminiKey()?geminiTTS(t):Promise.resolve(null);
  while(ep===ttsEpoch&&ttsQ.length){
    const t=ttsQ.shift();
    const a=await (cache||prep(t));cache=null;
    if(ep!==ttsEpoch)break;
    if(ttsQ.length)cache=prep(ttsQ[0]);
    if(vActive)setVoiceUI('speak');
    if(a){noVoiceWarned=false;await playPCM(a);}else await playBrowser(t);
  }
  if(ep===ttsEpoch)ttsBusy=false;
}
function stopSpeech(){
  ttsEpoch++;ttsQ=[];ttsBusy=false;
  try{speechSynthesis.cancel();}catch(e){}
  if(curSrc){try{curSrc.onended=null;curSrc.stop();}catch(e){}curSrc=null;}
}
function waitSpeech(){return new Promise(r=>{const iv=setInterval(()=>{if(!ttsBusy&&!ttsQ.length){clearInterval(iv);r();}},120);});}
async function testVoice(){
  const st=$('vtest');stopSpeech();unlockAudio();
  if(!getGeminiKey()){st.textContent='کلید Gemini وارد نشده؛ از «مدیریت کلیدها» اضافه‌ش کن.';return;}
  st.textContent='در حال گرفتن صدا…';
  const a=await geminiTTS('سلام، من جارویس هستم. این صدای منه؛ خوبه؟');
  if(!a){st.textContent='صدا نیومد: '+ttsErr;return;}
  st.textContent='پخش شد ✓';await playPCM(a);
}

/* ---------- حالت صوتی (مثل کلود) ---------- */
let vActive=false;
function setVoiceUI(state,cap){const v=$('vo');v.className='vo show '+(state||'');if(cap!=null)$('vcap').textContent=cap;}
function startVoice(){
  if(!getKey()){if(SHOW_KEY_BUTTON)openKeySheet();return;}
  if(vActive)return;
  unlockAudio();
  if(!ttsVoice&&!getGeminiKey()&&!noVoiceWarned){noVoiceWarned=true;toast('برای صدای فارسی، کلید Gemini رو از دکمه‌ی کلید اضافه کن؛ فعلاً جواب‌ها نوشته میشن');}
  vActive=true;wakeSync();setVoiceUI('listen','');voiceLoop();
}
function endVoice(){
  vActive=false;recSignal='cancel';stopSpeech();if(running)stopAll();
  $('vo').className='vo';wakeSync();
}
async function voiceLoop(){
  while(vActive){
    setVoiceUI('listen','دارم گوش می‌دم…');
    const r=await recordAudio({onLevel:l=>$('vo').style.setProperty('--lvl',Math.min(l*2.4,.5))});
    $('vo').style.setProperty('--lvl',0);
    if(!vActive)break;
    if(r.err){toast('به میکروفون دسترسی ندارم');endVoice();break;}
    if(r.cancelled||!r.spoke)continue;
    setVoiceUI('think','');
    let text='';
    try{ctrl=new AbortController();running=true;text=await whisper(r.blob);}catch(e){text='';}finally{running=false;}
    if(!text||!vActive)continue;
    $('vcap').textContent=text;
    voiceCtx=true;
    await submitMsg({role:'user',text,atts:[]});
    voiceCtx=false;
  }
}
$('vorb').onclick=()=>{if(!vActive)return;if(running||ttsBusy){stopAll();}else recSignal='end';};
$('vEnd').onclick=endVoice;

/* ---------- تایپ با صدا ---------- */
let dictating=false;
async function toggleDictate(){
  if(dictating){recSignal='end';return;}
  if(!getKey()){if(SHOW_KEY_BUTTON)openKeySheet();return;}
  dictating=true;$('mic').classList.add('rec');
  const r=await recordAudio({max:60000,silence:2200,noSpeech:8000});
  dictating=false;$('mic').classList.remove('rec');
  if(r.err)return toast('به میکروفون دسترسی ندارم');
  if(!r.spoke||r.cancelled)return;
  $('mic').classList.add('busy');
  try{const t=await whisper(r.blob);if(t){txt.value+=(txt.value?' ':'')+t;autoGrow();updatePrimary();txt.focus();}else toast('چیزی نشنیدم');}
  catch(e){toast('تشخیص صدا کار نکرد ('+e.message+')');}
  $('mic').classList.remove('busy');
}

/* ---------- «هی جارویس» ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let wakeRec=null,wakeBusy=false;
function isWakeTok(w){return /jarvis|ژارویس|جارویس|جاروس|جاراویس|جارویز/.test(w)||sim(w,'جارویس')>=0.7;}
function findWake(t){const tk=norm(t).split(' ').filter(Boolean);const i=tk.findIndex(isWakeTok);return i<0?null:tk.slice(i+1).join(' ');}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close();},130);}catch(e){}}
function wakeSync(){
  const on=settings.wake&&!vActive&&!!SR;
  if(wakeRec&&wakeRec._lang!==settings.speechLang){try{wakeRec.onend=null;wakeRec.stop();}catch(e){}wakeRec=null;}
  $('wakeInd').hidden=!on;
  if(on&&!wakeRec&&!wakeBusy)wakeStart();
  if(!on&&wakeRec){try{wakeRec.onend=null;wakeRec.stop();}catch(e){}wakeRec=null;}
}
function wakeStart(){
  wakeRec=new SR();wakeRec.lang=settings.speechLang==='en'?'en-US':'fa-IR';wakeRec.continuous=true;wakeRec.interimResults=false;
  wakeRec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(!e.results[i].isFinal)continue;
      const rest=findWake(e.results[i][0].transcript);
      if(rest!==null){onWake(rest);return;}
    }
  };
  wakeRec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){settings.wake=false;saveSettings();wakeRec=null;wakeSync();toast('دسترسی میکروفون داده نشد');}};
  wakeRec.onend=()=>{if(settings.wake&&!vActive&&!wakeBusy&&wakeRec)setTimeout(()=>{if(settings.wake&&!vActive&&!wakeBusy){try{wakeRec.start();}catch(e){}}},300);};
  wakeRec._lang=settings.speechLang;try{wakeRec.start();}catch(e){}
}
async function onWake(rest){
  if(wakeBusy||running||vActive)return;
  wakeBusy=true;try{wakeRec.onend=null;wakeRec.stop();}catch(e){}wakeRec=null;
  beep();
  let text=rest;
  if(!text&&getKey()){
    const r=await recordAudio();
    if(r.spoke&&!r.cancelled&&!r.err){try{ctrl=new AbortController();running=true;text=await whisper(r.blob);}catch(e){text='';}finally{running=false;}}
  }
  if(text&&getKey()){voiceCtx=true;await submitMsg({role:'user',text,atts:[]});voiceCtx=false;}
  wakeBusy=false;wakeSync();
}
